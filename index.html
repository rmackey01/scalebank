<!doctype html><html lang="en" class="keep-on"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="data:,"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head><body>
<title>Scale Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600&family=Lato:wght@400;700;900&display=swap">
<style>
/* Layout: one-column phone app, three screens over a fixed bottom tab bar; vendors swipe sideways with scroll-snap. */
:root{
  --ink:#0c1015;        /* wet stone at night */
  --stone:#151b22;
  --stone-2:#1e262f;
  --line:#2c3540;
  --fg:#efe5d1;         /* lantern paper */
  --muted:#9c978b;
  --gold:#d8a94b;
  --gold-hi:#f4d78f;
  --gold-lo:#7b5517;
  --lantern:#e2583e;
  --jade:#6fbf9f;
  --display:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;  /* headings at weight 600 */
  --body:"Lato","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--ink)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--ink);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--ink);border-inline:1px solid transparent}
@media (min-width:500px){#app{border-inline-color:var(--line)}}
.screen{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.pad{padding-inline:16px}

/* ---------- tab bar ---------- */
.tabs{flex:none;min-width:0;position:relative;display:flex;flex-flow:row nowrap;margin:0 8px 11px;padding:6px 0 4px;font-family:"Lato",var(--body)}
.tabs::before{content:"";position:absolute;inset:-6px;pointer-events:none;border-style:solid;border-width:26px 24px;border-image:url(art/nest/nav_bar_bg.webp) 78 72 fill / 26px 24px stretch}
.tab{position:relative;flex:1 1 0;min-width:0;overflow:hidden;white-space:nowrap;background:none;border:0;padding:4px 2px 9.55px;display:flex;flex-direction:column;align-items:center;gap:3.65px;color:#c3b197;font-size:11.5px;line-height:13.8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tab .ti{width:30px;height:30px;display:block}
.tab .ti.on,.tab[aria-current="page"] .ti.off{display:none}
.tab[aria-current="page"] .ti.on{display:block}
.tab[aria-current="page"]{color:#eeca74}
/* One shared underline that slides to the active tab (--ti is set by setTab). */
.tab-ul{position:absolute;z-index:1;top:-4.2px;left:calc((var(--ti,0) + .5) * 25%);width:50px;height:12px;margin-left:-25px;pointer-events:none;background:url(art/nest/nav_active_underline.webp) center/100% 100% no-repeat;transition:left .25s cubic-bezier(.65,0,.35,1)}
.tab .dot{position:absolute;top:-2px;left:calc(50% + 5px);width:20px;height:20px;animation:dotpulse 1.6s ease-in-out infinite}
@keyframes dotpulse{0%,100%{opacity:.7}50%{opacity:1}}
/* Keep is on for every visit. html.keep-on is the layout hook, not a flag. */
.tab-keep{display:none!important}
html.keep-on .tab-ul{left:calc((var(--ti,0) + .5) * 20%)}
html.keep-on .tab-keep{display:flex!important}
html.keep-on .tab-keep .ti{object-fit:contain}
/* Keep paintings stay hidden until they load, then the still or silhouette stands in if a sprite is missing. */
.keep-art{visibility:hidden}
.keep-art.is-ok{visibility:visible}
html.keep-on #keep{position:relative;overflow:hidden;background:var(--ink)}
/* The scene scrolls inside the keep, above the one real tab bar. Art and every overlay share .keep-fit. */
html.keep-on #keep .keep-stage{position:absolute;z-index:0;left:0;right:0;top:var(--keep-head,0px);bottom:var(--keep-tab,16px);overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;background:#070708}
html.keep-open .tabs{position:relative;z-index:2}
.keep-scroll{position:relative;width:100%}
.keep-clip{position:relative;width:100%;overflow:hidden}
.keep-fit{position:absolute;left:0;top:0;pointer-events:none}
.keep-bg{position:absolute;left:0;top:0;width:100%;height:100%;max-width:none;object-fit:fill;pointer-events:none}
/* Streak pill sits in the Keep header, under the title. */
.keep-streak{position:relative;z-index:1;display:flex;flex-flow:row nowrap;align-items:center;justify-content:center;gap:6px;box-sizing:border-box;width:auto;max-width:100%;height:auto;overflow:visible;padding:4px 8px;border-radius:999px;border:1px solid var(--gold-lo);background:rgba(12,16,21,.88);pointer-events:auto}
.keep-streak .ks-day{margin:0;font-family:var(--display);font-weight:600;font-size:12px;line-height:1;color:var(--gold-hi);white-space:nowrap}
.keep-streak .ks-best{margin:0;font-size:11px;line-height:1;letter-spacing:.02em;color:var(--muted);white-space:nowrap}
.keep-streak .ks-note{display:none}
.keep-streak .btn{min-width:0;width:auto;height:auto;margin:0;padding:0 7px;border-radius:999px;box-shadow:none;font-size:11px;line-height:1;white-space:nowrap}
/* Invisible taps on the painted lectern. A ring shows for keyboard focus only. */
.keep-spot{position:absolute;z-index:4;margin:0;padding:0;border:0;border-radius:50%;background:transparent;color:transparent;font-size:0;line-height:0;cursor:pointer;pointer-events:auto}
/* Header and Build are the app's own chrome. Build stays fixed above the tab bar. */
.keep-head{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:4px;box-sizing:border-box;padding:8px 12px 6px;pointer-events:none;color:#f4d78f}
.keep-head .kh-row{position:relative;display:flex;align-items:center;justify-content:center;width:100%;min-height:22px}
.keep-head h1{margin:0;min-width:0;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.14em;text-transform:uppercase;line-height:1;white-space:nowrap}
.keep-head .kh-coins{position:absolute;right:0;top:50%;display:inline-flex;align-items:center;gap:4px;margin:0;transform:translateY(-50%);font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;line-height:1;color:var(--gold-hi);white-space:nowrap}
.keep-head .kh-coin{width:14px;height:14px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 32%,#fff6d0,#f4d78f 42%,#c4923a 70%,#7b5517);box-shadow:inset 0 0 0 1px #6a4a12,0 1px 1px rgba(0,0,0,.45)}
.keep-build{position:absolute;z-index:5;right:12px;bottom:calc(var(--keep-tab,16px) + 8px);left:auto;top:auto;display:flex;align-items:center;justify-content:center;width:auto;min-width:76px;height:32px;margin:0;padding:0 12px;border:1.5px solid #5a3810;border-radius:8px;color:#3a2412;background:linear-gradient(180deg,rgba(255,244,214,.55),rgba(255,244,214,0) 42%),linear-gradient(180deg,#f0d59a 0%,#c8923e 48%,#8a5a1c 100%);box-shadow:inset 0 1px 0 rgba(255,248,220,.85),inset 0 -2px 0 rgba(74,40,8,.28),0 2px 3px rgba(0,0,0,.45);font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.12em;line-height:1;text-transform:uppercase;cursor:pointer;pointer-events:auto}
.keep-build:focus{outline:none}
.keep-build:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.keep-filters{position:absolute;width:0;height:0;overflow:hidden}
.keep-slot{position:absolute;margin:0;padding:0;border:0;background:transparent;line-height:0;pointer-events:auto}
.keep-slot img{width:100%;height:100%;display:block;object-fit:fill;pointer-events:none}
.keep-spot:focus{outline:none}
.keep-spot:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.keep-spot.is-live::before{content:"";position:absolute;inset:-35%;border-radius:50%;pointer-events:none;mix-blend-mode:screen}
.keep-forge.is-live::before{background:radial-gradient(ellipse at 50% 42%, rgba(255,226,160,.95), rgba(255,150,40,.5) 42%, transparent 72%)}
.keep-pool.is-live::before{background:radial-gradient(ellipse at 50% 55%, rgba(220,248,255,.95), rgba(90,190,255,.55) 46%, transparent 74%)}
/* Pens are percentages of the full 1008×1792 painting, inside the same fit as the art. */
.keep-world{position:absolute;z-index:2;left:0;top:0;width:100%;height:100%;pointer-events:none}
.keep-fence{position:absolute;left:0;top:0;width:100%;height:100%;max-width:none;object-fit:fill;pointer-events:none}
.keep-plates{position:absolute;z-index:4;left:0;top:0;width:100%;height:100%;pointer-events:none}
.pen-plaques{position:absolute;z-index:5;inset:0;pointer-events:none}
.keep-pen{position:absolute}
.keep-ground{position:absolute;left:6%;right:6%;bottom:0;height:36%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(216,169,75,.2),rgba(216,169,75,0) 72%)}
.keep-stage:has(.keep-bg.is-ok) .keep-ground{display:none}
/* Brass plaque with a lock, centered on the pen floor. */
.pen-lock,.wing-lock{position:absolute;z-index:3;left:50%;top:50%;display:flex;flex-flow:row nowrap;align-items:center;gap:5px;width:max-content;max-width:calc(100% - 6px);box-sizing:border-box;margin:0;padding:4px 8px 4px 6px;border-radius:7px;border:1.5px solid #5a3810;color:#3a2412;background:linear-gradient(180deg,rgba(255,244,214,.55),rgba(255,244,214,0) 42%),linear-gradient(180deg,#f0d59a 0%,#c8923e 48%,#8a5a1c 100%);box-shadow:inset 0 1px 0 rgba(255,248,220,.85),inset 0 -2px 0 rgba(74,40,8,.28),0 2px 3px rgba(0,0,0,.45);font-family:var(--display);font-weight:700;line-height:1;text-align:left;pointer-events:none;transform:translate(-50%,-50%)}
.pen-lock svg,.wing-lock svg{width:14px;height:14px;flex:none;display:block}
.pen-lock b,.wing-lock b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.pen-lock small,.wing-lock small{display:block;margin-top:1px;font-size:9px;letter-spacing:.03em;font-weight:600}
.keep-pen .pen-lock{display:none}
.keep-pen.is-open .pen-lock{display:none}
/* Cleared wing on the painting. The plaque sits in the middle of that box and leaves when the wing opens. */
.keep-wing{position:absolute;z-index:4;pointer-events:none}
.keep-wing.is-open{display:none}
.pen-dragon{position:absolute;padding:0;border:0;background:transparent;line-height:0;transform:translate(-50%,-100%);pointer-events:auto;transition:none}
.pen-shadow{position:absolute;z-index:1;left:50%;bottom:0;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(3px);pointer-events:none;transform:translate(-50%,45%)}
.pen-dragon:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px;border-radius:10px}
.pen-sprite{position:relative;z-index:2;display:block;background-repeat:no-repeat;background-position:left center}
.pen-sprite svg{display:none;width:100%;height:100%}
.pen-sprite.is-ph svg{display:block}
.ledger{width:min(100%,420px);height:100%;max-height:100%;min-height:0;display:flex;flex-direction:column;gap:8px}
.ledger-sheet{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--gold-lo);border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#2a241c,#14110e)}
.ledger-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;pointer-events:none}
.ledger-body{position:relative;z-index:1;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:4px;padding:8px 10px 6px;background:linear-gradient(180deg,rgba(20,17,14,.84),rgba(12,10,8,.62) 30%,rgba(12,10,8,.8))}
.ledger-body h2{margin:0;text-align:center;font-family:var(--display);font-weight:600;font-size:22px;line-height:1.05;color:var(--gold-hi)}
.ldg-swap{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;margin:0;text-align:center;color:var(--gold-hi);font-size:12px}
.ldg-swap .btn{min-width:0;padding:4px 8px;font-size:11px}
.ldg-sec{min-width:0}
.ldg-sec h3{margin:0 0 2px;font-family:var(--display);font-weight:600;font-size:15px;line-height:1.15;color:var(--fg)}
.ldg-stables-sec{flex:1;min-height:0;display:flex;flex-direction:column}
.ldg-stables{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.ldg-list{list-style:none;margin:0;padding:0}
.ldg-empty{margin:0 0 6px;color:var(--muted);font-size:13px}
.ldg-row{display:grid;grid-template-columns:32px minmax(0,1fr);column-gap:6px;row-gap:1px;align-items:center;padding:3px 2px;border-bottom:1px solid rgba(216,169,75,.22)}
.ldg-row.is-pick{background:rgba(216,169,75,.2);border-radius:10px;box-shadow:inset 0 0 0 1px var(--gold)}
.ldg-art{grid-column:1;grid-row:1 / span 2;width:32px;height:32px}
.ldg-art .dart{width:32px;height:32px;aspect-ratio:auto;border-radius:7px}
.ldg-who{grid-column:2;grid-row:1;min-width:0;display:flex;flex-direction:column;gap:0}
.ldg-name{justify-self:start;max-width:100%;background:none;border:0;padding:0;font-family:var(--display);font-weight:600;font-size:15px;line-height:1.05;color:var(--gold-hi);text-align:left}
.ldg-name:hover{text-decoration:underline}
.ldg-meta{font-size:11px;line-height:1.15;color:var(--muted)}
.ldg-meta .r{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:10px}
.ldg-acts{grid-column:2;grid-row:2;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.ldg-acts .btn,.ldg-swap .btn{min-width:0;padding:3px 7px;border-radius:8px;font-size:11px;white-space:nowrap}
.ldg-roam .ldg-row{grid-template-columns:26px minmax(0,1fr) auto;align-items:center;padding:1px 0}
.ldg-roam .ldg-art{grid-row:1;width:26px;height:26px}
.ldg-roam .ldg-art .dart{width:26px;height:26px}
.ldg-roam .ldg-who{grid-row:1;flex-direction:row;flex-wrap:wrap;align-items:baseline;column-gap:6px}
.ldg-roam .ldg-name{font-size:14px}
.ldg-roam .ldg-acts{grid-column:3;grid-row:1}
.ldg-hint{margin:0 0 2px;color:var(--gold-hi);font-size:11px;line-height:1.2}
.ledger > .btn{align-self:center;min-width:140px;padding:8px 16px}
.care{width:min(100%,420px);height:100%;max-height:100%;min-height:0;display:flex;flex-direction:column;gap:8px}
.care-ov{z-index:24}
.care-sheet{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;border:1px solid var(--gold-lo);border-radius:16px;background:linear-gradient(180deg,#2a241c,#14110e);padding:12px 12px 14px}
.care-top{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:center}
.care-top .dart{width:72px;border-radius:10px}
.care-name{margin:0;font-family:var(--display);font-weight:600;font-size:24px;line-height:1.05;color:var(--gold-hi)}
.care-top .bond{margin-top:8px}
.bond{height:10px;border-radius:999px;background:#1b160f;border:1px solid var(--gold-lo);overflow:hidden}
.bond i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi))}
.bond-n{margin-top:3px;font-size:11px;letter-spacing:.08em;color:var(--gold-hi)}
.wax-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.wax{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;position:relative;font-family:var(--display);font-weight:700;font-size:14px;color:#2a160c;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55),transparent 42%),radial-gradient(circle at 70% 78%,rgba(0,0,0,.2),transparent 46%),var(--mut-acc,var(--gold));box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.45),0 1px 1px rgba(0,0,0,.35);border:2px solid rgba(70,28,10,.4)}
.wax::after{content:"";position:absolute;inset:3px;border-radius:50%;border:1px dashed rgba(60,20,8,.4);pointer-events:none}
.care-pleased{margin:8px 0 0;text-align:center;color:var(--gold-hi);font-size:13px}
.care-acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}
.care-acts .btn{min-width:0;padding:8px 4px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1}
.care-acts .btn small{font-weight:600;font-size:10px;letter-spacing:.04em}
.care-sheet h3{margin:14px 0 6px;font-family:var(--display);font-weight:600;font-size:18px;color:var(--fg)}
.care-note{margin:0 0 8px;font-size:13px;line-height:1.35;color:var(--fg)}
.care-note.locked{color:var(--muted);font-style:italic}
.care > .btn{align-self:center;min-width:140px;padding:8px 16px}
@keyframes careHop{0%{transform:translateY(0)}35%{transform:translateY(-10px)}70%{transform:translateY(0)}85%{transform:translateY(-3px)}100%{transform:translateY(0)}}
.care-top.is-happy .dart{animation:careHop .7s ease}
@media (prefers-reduced-motion:reduce){.care-top.is-happy .dart{animation:none}}

/* ---------- shared bits ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.topbar h1{font-family:var(--display);font-weight:600;font-size:24px;margin:0;letter-spacing:.01em}
.chip{display:inline-flex;align-items:baseline;gap:5px;padding:5px 11px;border-radius:999px;border:1px solid var(--gold-lo);background:var(--stone);font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;color:var(--gold-hi);white-space:nowrap}
.chip small{font-weight:500;color:var(--muted);font-size:12px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.btn{border:1px solid var(--gold);background:linear-gradient(180deg,#e8bd5f,#b9862e);color:#1b1206;font-weight:700;border-radius:12px;padding:12px 16px;letter-spacing:.01em;box-shadow:inset 0 1px 0 rgba(255,240,200,.5),0 2px 0 #5c3d0c}
.btn:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,240,200,.5),0 1px 0 #5c3d0c}
.btn.ghost{background:transparent;color:var(--gold-hi);box-shadow:none;border-color:var(--gold-lo)}
.btn[disabled]{background:var(--stone-2);border-color:var(--line);color:var(--muted);box-shadow:none;cursor:default}
.toast{position:absolute;left:16px;right:16px;top:12px;z-index:30;background:#1b2229;border:1px solid var(--gold-lo);color:var(--fg);padding:11px 14px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:14px;transform:translateY(calc(-100% - 16px));transition:transform .3s ease}
.toast.show{transform:none}

/* ---------- bank ---------- */
#bank{display:flex;flex-direction:column;background:radial-gradient(120% 60% at 50% -10%,rgba(216,169,75,.10),transparent 60%),var(--ink)}
.bank-main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px;padding-block:24px}
.balance{font-family:var(--display);font-weight:600;font-size:clamp(64px,22vw,104px);line-height:1;letter-spacing:-.01em;color:var(--fg);font-variant-numeric:lining-nums tabular-nums;text-shadow:0 0 40px rgba(216,169,75,.18)}
.balance-unit{font-size:15px;color:var(--gold);letter-spacing:.2em;text-transform:uppercase;font-weight:600}
.afford{max-width:30ch;margin:18px auto 0;color:var(--fg);opacity:.82;font-size:15px;text-wrap:balance}
.lifetime{margin-top:22px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lifetime b{color:var(--fg);font-weight:600}
.bank-foot{padding-block:8px 18px;display:flex;flex-direction:column;gap:10px}
.step-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.step-btns .btn{padding:15px 10px;font-size:16px}
.sim-note{text-align:center;font-size:12px;color:var(--muted)}
/* Destructive: red from the start, solid red once armed. The armed state times out after 3 s. */
.reset{align-self:center;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 16px;border-radius:10px;border:1px solid rgba(226,88,62,.55);background:rgba(226,88,62,.07);color:#f0907a;font-size:13px;font-weight:700;transition:background .15s,color .15s}
.reset small{font-size:11px;font-weight:400;color:#c98f80}
.reset.armed{background:#c2412a;border-color:#f3a08b;color:#fff}
.reset.armed small{color:#ffe0d6}

/* ---------- vendors ---------- */
#vendors{display:flex;flex-direction:column;overflow:hidden}
.vrail{position:relative;flex:none;display:grid;grid-template-columns:repeat(3,1fr);margin:12px 16px 6px;padding:4px;background:var(--stone);border:1px solid var(--line);border-radius:14px}
.vtab{position:relative;z-index:1;background:none;border:0;padding:7px 4px 6px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);min-width:0;transition:color .2s}
.vtab b{font-family:var(--display);font-weight:600;font-size:15px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.vtab small{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:inline-flex;gap:3px;align-items:center;opacity:.85}
.vtab small svg{width:10px;height:10px}
.vtab[aria-selected="true"]{color:var(--gold-hi)}
.vtab.locked b{opacity:.7}
.vind{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / 3);border-radius:10px;background:linear-gradient(180deg,rgba(216,169,75,.24),rgba(216,169,75,.07));border:1px solid var(--gold-lo);transform:translateX(calc(var(--p,0) * 100%));pointer-events:none}
.scenes{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.scenes::-webkit-scrollbar{display:none}
.scene{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;padding-inline:16px;padding-block:2px 24px}
.art{position:relative;aspect-ratio:6/5;max-width:100%;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:inset 0 0 0 1px rgba(216,169,75,.18);background:#0b0d10}
.art > video{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 50%}
.art[data-vendor="stall"] > video{object-position:20% 50%}
.art[data-vendor="kiln"] > video{object-position:22% 50%}
.art[data-vendor="roost"] > video{object-position:5% 50%}
.art[data-vendor="kiln"] .vtitle{bottom:4px}
.art[data-vendor="kiln"] .vtitle .eyebrow{letter-spacing:.05em;line-height:1.15}
.art[data-vendor="kiln"] .vtitle h2{margin:2px 0 0;line-height:1}
.art[data-vendor="roost"] .vtitle{bottom:4px}
.art[data-vendor="roost"] .vtitle .eyebrow{letter-spacing:.1em}
.art[data-vendor="roost"] .shade{background:linear-gradient(180deg,transparent 22%,rgba(8,10,13,.16) 52%,rgba(8,10,13,.48) 78%,rgba(8,10,13,.82))}
.scene.is-locked .art > video{filter:grayscale(.65) brightness(.55)}
.art .shade{position:absolute;inset:auto 0 0 0;height:58%;background:linear-gradient(180deg,transparent,rgba(8,10,13,.92));pointer-events:none}
.vtitle{position:absolute;left:14px;right:14px;bottom:12px;pointer-events:none}
.vtitle .eyebrow{color:#d9cfbd}
.vtitle h2{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.05;margin:3px 0 3px;color:#fff6e6;text-wrap:balance;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.quip{margin:0;color:#d4cab8;font-style:italic;font-size:13px}
.lockbadge{position:absolute;inset:10px 10px auto auto;display:flex;align-items:center;gap:6px;background:rgba(12,16,21,.85);border:1px solid var(--gold-lo);color:var(--gold-hi);padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.vnav{position:absolute;top:38%;transform:translateY(-50%);width:40px;height:40px;padding:0;border-radius:50%;border:1px solid rgba(244,215,143,.55);background:rgba(10,12,16,.62);color:var(--gold-hi);display:grid;place-items:center;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.vnav svg{width:18px;height:18px}
.vnav.prev{left:8px}.vnav.next{right:8px}
.vtools{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;margin-inline:-16px;padding:10px 16px 8px;background:linear-gradient(var(--ink) 78%,rgba(12,16,21,0))}
.fchips{display:flex;gap:5px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-mask:linear-gradient(90deg,#000 88%,transparent);mask:linear-gradient(90deg,#000 88%,transparent);padding-right:14px}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;display:inline-flex;align-items:baseline;gap:4px;padding:6px 9px;border-radius:999px;border:1px solid var(--line);background:var(--stone);color:var(--fg);font-size:12.5px;font-weight:600}
.fchip i{font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.fchip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-hi);background:rgba(216,169,75,.12)}
.vtools .chip{flex:none;padding:5px 10px;align-items:center;gap:5px}
.ghead{display:flex;align-items:baseline;gap:8px;margin:14px 0 8px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.ghead::after{content:"";flex:1;height:1px;background:var(--line);align-self:center}
.ghead + .list{margin-top:0}
.lockcard{margin-top:12px;border:1px solid var(--gold-lo);background:linear-gradient(180deg,rgba(216,169,75,.08),rgba(216,169,75,.02));border-radius:14px;padding:14px}
.lockcard p{margin:0 0 10px}
.missing{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.missing li{display:flex;justify-content:space-between;gap:12px;font-weight:600}
.missing li span:last-child{font-variant-numeric:tabular-nums;color:var(--gold-hi);white-space:nowrap}
.lockcard .btn{margin-top:12px;width:100%}
.list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.list.teaser{opacity:.45;pointer-events:none}
.item{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--stone);border:1px solid var(--line)}
.item.owned{background:transparent}
.thumb{position:relative;width:76px;height:76px;display:grid;place-items:center;border-radius:12px;background:radial-gradient(70% 60% at 50% 70%,#2a221a,#14181e);border:1px solid #2a2a26;overflow:hidden}
.thumb .shopegg{position:absolute;left:50%;top:50%;width:92px;height:92px;max-width:none;transform:translate(-50%,-58%)}
.thumb .dart.tthumb{position:absolute;inset:0;width:auto;aspect-ratio:auto;background:none;border-radius:0}
.thumb .dart.tthumb::after{display:none}
.kind{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.kind.r-uncommon{color:#93cf86}
.kind.r-rare,.r.r-rare{color:#b9b6f0}
.kind.r-epic,.r.r-epic{color:#d6a2ff}
.kind.r-legendary,.r.r-legendary{color:#ffd27a;text-shadow:0 0 10px rgba(255,200,100,.45)}
.r.r-common{color:#c9bfae} .r.r-uncommon{color:#93cf86}
.odds{display:flex;flex-wrap:wrap;gap:4px 6px;margin:-2px 0 9px}
.odds span{font-size:11px;color:var(--muted);background:var(--ink);border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-variant-numeric:tabular-nums}
.odds b{color:var(--fg);font-weight:600}
.odds .mut{border-color:rgba(190,160,255,.45);color:#cdb8ff}
.odds .mut b{color:#e6dcff}
.buyrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bought{font-size:12px;color:var(--jade);font-weight:600}
.iname{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.2;margin:1px 0 2px}
.hint{font-size:13px;color:var(--muted);margin:0 0 8px}
.buy{min-width:118px;padding:8px 12px;border-radius:10px;font-variant-numeric:tabular-nums;text-align:left;display:inline-flex;flex-direction:column;line-height:1.2}
.buy small{font-weight:500;font-size:11px;opacity:.85}
.buy.confirm{background:linear-gradient(180deg,#f07a5e,#c2412a);border-color:#f3a08b;color:#fff;box-shadow:inset 0 1px 0 rgba(255,220,200,.4),0 2px 0 #6a1b0f}
.owned-tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--jade)}
.empty-stock{margin-top:14px;padding:22px 16px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}

/* ---------- dragon screen ---------- */
.frame{position:relative;margin-top:4px;border-radius:20px;padding:18px 16px 18px;text-align:center;background:radial-gradient(80% 55% at 50% 45%,rgba(216,169,75,.16),transparent 70%),linear-gradient(180deg,#19140f,#101318);border:1px solid var(--gold-lo);box-shadow:inset 0 0 0 4px #0f1216,inset 0 0 0 5px rgba(216,169,75,.35)}
.plaque{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#1b1206;background:linear-gradient(180deg,var(--gold-hi),var(--gold));padding:4px 12px;border-radius:4px}
.stage{display:grid;place-items:center;margin-block:4px}
.stage .dart{width:min(240px,62vw)}
.pname{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.1;margin:0;overflow-wrap:anywhere}
.species{font-size:13px;color:var(--muted)}
.frame.empty .stage{position:relative;width:min(240px,62vw);margin-inline:auto}
.padlock{position:absolute;inset:0;display:grid;place-items:center}
.padlock svg{width:54px;height:54px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.6))}
.frame.empty .pname{color:var(--muted)}
.frame.empty p{margin:8px auto 14px;max-width:32ch;color:var(--fg);opacity:.85;text-wrap:balance}
.section{margin-top:22px}
.section h2{font-family:var(--display);font-weight:600;font-size:21px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.section h2 small{font-family:var(--body);font-size:12px;color:var(--muted)}
.custom{display:flex;flex-direction:column;gap:14px;background:var(--stone);border:1px solid var(--line);border-radius:16px;padding:14px}
.crow{display:flex;flex-direction:column;gap:7px}
.crow label,.crow .lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.crow input{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);font:inherit;font-size:16px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--ink);font-size:14px;font-weight:600}
.opt[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-hi);background:rgba(216,169,75,.1)}
.sw{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.25)}
.none-note{font-size:13px;color:var(--muted);margin:0}
.share-btn{width:100%;margin-top:14px;padding:14px;font-size:16px}
/* ---------- nest (asset pack, handoff/nest-spec.md) ---------- */
/* Every length is in spec px on the 390-wide frame (--u). z-index values are the spec's layer numbers (§3). */
@property --edge{syntax:"<number>";inherits:true;initial-value:0}
@property --sp{syntax:"<number>";inherits:true;initial-value:0}
#nest{padding-inline:0;overflow-x:hidden;background:#03060b url(art/nest/background.webp) center top/cover no-repeat}
.hx{container-type:inline-size;width:100%}
/* The backdrop lives on the stage too, so the screen-blended embers and glows have something to blend with. */
.hx-in{--u:calc(100cqw / 390);position:relative;width:100%;overflow:hidden;font-family:"Lato",var(--body);background:#03060b url(art/nest/background.webp) center top/100% auto no-repeat}
.hx-in > *,.hx-dyn > *{position:absolute}
.hx-dyn{inset:0}
.hx-in img{display:block;user-select:none;-webkit-user-drag:none}
.hx-in .em{left:0;top:0;width:calc(24*var(--u));height:calc(24*var(--u));pointer-events:none;mix-blend-mode:screen}
.hx-in .em img{width:100%;height:100%}
.hx-banner{z-index:12;background:url(art/nest/banner_panel.webp) center/100% 100% no-repeat}
.hx-btext,.hx-status,.hx-caps,.hx-body{margin:0;text-shadow:0 calc(.6*var(--u)) calc(.8*var(--u)) rgba(0,0,0,.6)}
.hx-btext,.hx-status,.hx-body{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hx-btext{z-index:12;font-size:calc(16*var(--u));line-height:calc(21*var(--u));color:#f5e5c1}
.hx-cab-back{z-index:2;border-style:solid;border-width:calc(24*var(--u)) calc(22*var(--u)) calc(30*var(--u));border-image:url(art/nest/cabinet_back.webp) 72 66 90 fill / calc(24*var(--u)) calc(22*var(--u)) calc(30*var(--u)) stretch;box-sizing:border-box}
.hx-cab-frame{z-index:11;pointer-events:none;border-style:solid;border-image:url(art/nest/cabinet_frame.webp) 168 102 126 / calc(56*var(--u)) calc(34*var(--u)) calc(42*var(--u)) stretch;border-width:calc(56*var(--u)) calc(34*var(--u)) calc(42*var(--u));box-sizing:border-box}
/* Glows from build_mockup.py: each is drawn twice, once normally and once screened. */
.hx-blight{z-index:3;border-radius:50%;background:#5a3216;opacity:.22;filter:blur(calc(18*var(--u)))}
.hx-spill{z-index:6;height:calc(16*var(--u));width:calc(92*max(var(--sp),.35)*var(--u));border-radius:50%;background:var(--c);opacity:.4;filter:blur(calc(5*var(--u)));transition:--sp .6s cubic-bezier(.33,1,.68,1)}
.hx-blight.scr,.hx-spill.scr{mix-blend-mode:screen}
.hx-shelf{z-index:5}
.hx-conn{z-index:9}
.hx-ring{z-index:4;overflow:hidden;pointer-events:none;animation:ringin .6s cubic-bezier(.33,1,.68,1) both}
.hx-ring.held{animation:none}
.hx-ring > img{width:100%;height:100%}
/* The 12x8 sprite sheet is stepped by background position, so only the ring's own box is ever
   painted (moving a transformed sheet 12x8 times its size is too large a layer for Safari).
   --rd keeps the loop's phase when the Nest re-renders. */
.hx-ring .rs{width:100%;height:100%;background:url(art/nest/ring_sheet.webp) 0 0/1200% 800% no-repeat;animation:rsx .5s steps(12) infinite,rsy 4s steps(8) infinite;animation-delay:var(--rd,0s)}
@keyframes rsx{to{background-position-x:109.0909%}}
@keyframes rsy{to{background-position-y:114.2857%}}
@keyframes ringin{from{opacity:0;transform:scale(.85)}}
.hx-slot{z-index:7;padding:0;border:0;background:none;cursor:pointer;transform-origin:50% 95%;transition:transform .12s}
.hx-slot img{position:relative;width:100%;height:100%}
.hx-slot:active{transform:scale(.96)}
.hx-slot .glow{position:absolute;left:10%;right:10%;top:0;bottom:12%;border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,rgba(255,176,90,calc(.05 + var(--p) * .22)),transparent)}
.hx-slot.sel .glow{background:radial-gradient(closest-side,rgba(255,214,130,calc(.22 + var(--p) * .2)),transparent);box-shadow:0 calc(30*var(--u)) calc(20*var(--u)) calc(-14*var(--u)) rgba(244,215,143,.55)}
/* Within 2,000 steps of hatching: a 0.9 s wobble, then 2.2 s of rest. */
.hx-slot.near{animation:eggwobble 3.1s cubic-bezier(.37,0,.63,1) infinite}
@keyframes eggwobble{0%{transform:rotate(0)}6%{transform:rotate(-4deg) scale(1.02,.98)}12%{transform:rotate(4deg)}18%{transform:rotate(-2.5deg)}24%{transform:rotate(1.5deg)}29%,100%{transform:rotate(0)}}
.hx-slot.empty{opacity:.55;pointer-events:none}
.hx-slot:focus-visible{outline:2px solid var(--gold-hi);outline-offset:-4px;border-radius:24%}
/* Tube (§4): the fill image is never scaled, only masked up to --edge. --edge is registered so it animates. */
.hx-tube{z-index:10;transition:--edge .6s cubic-bezier(.33,1,.68,1)}
.hx-tube > *{position:absolute;inset:0;width:100%;height:100%}
.hx-tube .fill{
  -webkit-mask:linear-gradient(#000 0 0) 0 0/calc((var(--edge) - 7.6)*var(--u)) 100% no-repeat,radial-gradient(closest-side,#000 calc(100% - 1px),transparent) calc((var(--edge) - 15.2)*var(--u)) calc(4.4*var(--u))/calc(15.2*var(--u)) calc(19.2*var(--u)) no-repeat;
          mask:linear-gradient(#000 0 0) 0 0/calc((var(--edge) - 7.6)*var(--u)) 100% no-repeat,radial-gradient(closest-side,#000 calc(100% - 1px),transparent) calc((var(--edge) - 15.2)*var(--u)) calc(4.4*var(--u))/calc(15.2*var(--u)) calc(19.2*var(--u)) no-repeat}
.hx-tube .sheen{inset:auto;left:calc(7.4*var(--u));top:calc(6.4*var(--u));width:calc((var(--edge) - 7.4)*var(--u));height:calc(15.2*var(--u));border-radius:calc(7.6*var(--u));overflow:hidden}
.hx-tube .sheen::before{content:"";position:absolute;top:0;bottom:0;left:calc(-12*var(--u));width:calc(12*var(--u));background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);animation:sheen 3.2s infinite;animation-delay:var(--sd,0s)}
@keyframes sheen{0%{left:calc(-12*var(--u));animation-timing-function:cubic-bezier(.37,0,.63,1)}37.5%,100%{left:100%}}
.hx-tube .men{inset:auto;left:calc((var(--edge) - 3.2)*var(--u));top:calc(7.6*var(--u));width:calc(3.4*var(--u));height:calc(12.8*var(--u));border-right:calc(.67*var(--u)) solid rgba(255,255,255,.65);border-radius:50%;filter:blur(calc(.25*var(--u)))}
.hx-status{z-index:13;text-align:center;font-size:calc(16*var(--u));line-height:calc(21*var(--u));color:#f4da9a;text-shadow:0 0 calc(2*var(--u)) rgba(244,200,100,.35),0 calc(.6*var(--u)) calc(.8*var(--u)) rgba(0,0,0,.6);text-wrap:balance}
.hx-status b{color:#ffe3a0;font-weight:700}
.hx-card{z-index:14;background:url(art/nest/info_card_panel.webp) center/100% 100% no-repeat}
.hx-portrait,.hx-caps,.hx-title,.hx-body,.hx-cta{z-index:15}
.hx-portrait > img{position:absolute;inset:0;width:100%;height:100%}
.hx-portrait .pe{inset:auto}
.hx-caps{font-size:calc(10.5*var(--u));line-height:calc(12.6*var(--u));font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#e1b567;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx-title{margin:0;font-family:"Cormorant Garamond",var(--display);font-weight:600;font-size:calc(28*var(--u));line-height:calc(33.91*var(--u));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(180deg,#fff1cc,#e9c27e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 calc(2*var(--u)) rgba(233,194,126,.45))}
.hx-body{font-size:calc(13*var(--u));line-height:calc(18.5*var(--u));color:#ededea}
.hx-cta{display:flex;align-items:flex-start}
.xf{animation:xf .2s ease-out both}
@keyframes xf{from{opacity:0}}
.hx-btn{white-space:nowrap;padding:calc(7*var(--u)) calc(16*var(--u));border-radius:calc(10*var(--u));border:1px solid #f3c859;background:linear-gradient(180deg,#ffe9a8,#e8b451 45%,#9a5e18);color:#2a1606;font-family:"Lato",var(--body);font-weight:900;font-size:calc(14*var(--u));box-shadow:inset 0 1px 0 rgba(255,250,220,.7),0 calc(2*var(--u)) 0 #5c3d0c}
.hx-btn:active{transform:translateY(1px)}
.hoard{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.hd{padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:600;min-width:0}
.hd .dart{width:72px;border-radius:8px}
.hd > span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd > span.hd-rarity{display:inline-flex;align-items:baseline;justify-content:center;gap:4px;max-width:100%;white-space:nowrap;overflow:visible;text-overflow:clip}
.hd-rarity .walk-tag{margin-left:0;flex:none;max-width:none;overflow:visible}
.hd[aria-pressed="true"]{color:var(--gold-hi)}
.hd small{font-weight:500;color:var(--muted);font-size:11px}
.hd em{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.hoard-note{margin:-4px 0 10px;font-size:13px;color:var(--muted)}
.mutb{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#e6dcff;border:1px solid rgba(190,160,255,.5);background:rgba(150,120,230,.12);padding:3px 10px;border-radius:999px}
.growth{margin:12px auto 0;max-width:290px;text-align:left}
.growth-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stage-pill{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#1b1206;background:linear-gradient(180deg,var(--gold-hi),var(--gold));padding:3px 9px;border-radius:4px}
.growth-note{font-size:11px;color:var(--muted);text-align:right}
.grew-note{font-family:var(--display);font-weight:600;color:var(--gold-hi);font-size:18px;margin:-4px 0 2px;animation:grewnote 2.4s ease-out both}
@keyframes grewnote{0%,30%{opacity:0;transform:translateY(6px)}50%,100%{opacity:1;transform:none}}
.replay-reveal{margin-top:10px;background:transparent;border:1px solid var(--gold-lo);color:var(--gold);padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600}

/* ---------- rarity frames (handoff/feature-rarity-frames.md) ---------- */
.rf{--rf-w:1px;--rf-r:14px;
  --rf-fill:linear-gradient(#151b22,#151b22);
  --rf-border:linear-gradient(#2c3540,#2c3540);
  --rf-in:0 0 #0000;--rf-out:0 0 #0000;--rf-mutin:0 0 #0000;--rf-sel:0 0 #0000;
  position:relative;
  border:var(--rf-w) solid transparent;border-radius:var(--rf-r);
  background:var(--rf-fill) padding-box,var(--rf-border) border-box;
  box-shadow:var(--rf-sel),var(--rf-out),var(--rf-mutin),var(--rf-in)}
.rf-common{--rf-w:1px;--rf-border:linear-gradient(160deg,#b39062 0%,#6e583c 100%)}
.rf-uncommon{--rf-w:2px;--rf-border:linear-gradient(160deg,#c9edb9 0%,#93cf86 40%,#3e7a16 100%);--rf-in:inset 0 0 10px rgba(147,207,134,.12)}
.rf-rare{--rf-w:2px;--rf-border:linear-gradient(160deg,#dcdaff 0%,#b9b6f0 40%,#3c35a6 100%);--rf-in:inset 0 0 12px rgba(185,182,240,.16)}
.rf-epic{--rf-w:2px;--rf-border:linear-gradient(160deg,#f0d6ff 0%,#d6a2ff 40%,#6a2c90 100%);--rf-in:inset 0 0 14px rgba(214,162,255,.20);--rf-out:0 0 10px rgba(166,79,214,.35)}
.rf-legendary{--rf-w:3px;--rf-border:linear-gradient(160deg,#ffe9a8 0%,#e8b451 22%,#9a5e18 45%,#6e400f 60%,#c68a30 80%,#ffd98a 100%);--rf-in:inset 0 0 18px rgba(255,200,100,.16);--rf-out:0 0 14px rgba(255,200,100,.35)}
.rf-mut{--rf-fill:linear-gradient(180deg,#26283a,#151b22);--rf-mutin:inset 0 0 0 1px rgba(190,160,255,.5)}
.rf-common.rf-mut{--rf-w:2px}
.rf-none{--rf-border:linear-gradient(#4a4844,#3a3936)}
.rf[aria-pressed="true"]{position:relative}
.rf[aria-pressed="true"]::after{content:"";position:absolute;inset:calc(-1 * var(--rf-w));border-radius:inherit;pointer-events:none;
  box-shadow:0 0 0 2px rgba(255,244,220,.85),0 0 18px 4px rgba(255,236,200,.35);animation:prizeBreath 2.4s ease-in-out infinite}
@keyframes prizeBreath{0%,100%{opacity:.6}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.rf[aria-pressed="true"]::after{animation:none;opacity:1}}
.walk-tag{margin-left:4px;display:inline-flex;color:#fff4dc;line-height:0}
.walk-tag svg{width:12px;height:12px;display:block}
.rf:focus-visible{outline-offset:6px}
@supports (mask-composite:exclude) or (-webkit-mask-composite:xor){
  .rf-mut::before{content:"";position:absolute;inset:calc(-1 * var(--rf-w));padding:var(--rf-w);border-radius:inherit;pointer-events:none;
    background:linear-gradient(115deg,transparent 42%,rgba(230,220,255,.95) 50%,transparent 58%) 50% 0/300% 100% no-repeat;
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
            mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
    animation:rfshim 4.8s cubic-bezier(.37,0,.63,1) infinite;animation-delay:var(--rfd,0s)}
}
@keyframes rfshim{0%{background-position:100% 0}40%,100%{background-position:0% 0}}
@media (prefers-reduced-motion:reduce){.rf-mut::before{animation:none;background-position:50% 0;opacity:.7}}
.rf-wrap{--rf-r:14px;--rf-fill:linear-gradient(#0c1015,#0c1015);padding:6px;line-height:0}
.rf-wrap > .dart{border-radius:8px}
.rf-wrap.rf-mut{--rf-fill:linear-gradient(180deg,#26283a,#0c1015)}

.hstage.wobble .halves{animation:wobble .45s ease-in-out 2;transform-origin:50% 85%}

/* ---------- dragon idle ---------- */
/* Each dragon stage is a whole looping video. Its card takes the video's own edge color (--edge)
   and the video's edges fade into it, so the painting blends into the card with no frame line. */
.dart{position:relative;aspect-ratio:784/1168;max-width:100%;flex:none;background:var(--edge,#d8c8ac);border-radius:14px;overflow:hidden;isolation:isolate}
.dart > video,.dart > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;user-select:none;
  -webkit-mask:radial-gradient(ellipse 74% 78% at 50% 48%,#000 60%,transparent 100%);mask:radial-gradient(ellipse 74% 78% at 50% 48%,#000 60%,transparent 100%)}
.dart::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.dart .trail{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.dart.ghost{background:radial-gradient(ellipse 70% 60% at 50% 50%,#e8dcc4,var(--edge) 80%)}
.dart.grow-in{animation:growin 1.6s ease-out both}
@keyframes growin{0%{filter:brightness(1.9) saturate(.6)}100%{filter:none}}
/* Mutation card effects: fallback only, when the mutation's own art isn't in the manifest. */
.dart.fx-moon{box-shadow:0 0 0 2px rgba(206,220,255,.9),0 0 28px rgba(150,180,255,.6)}

function asList(v){ return Array.isArray(v) ? v : []; }
function asMap(v){ return v && typeof v === "object" && !Array.isArray(v) ? v : {}; }

function revealSrc(line, key){ return `art/reveals/${line}-${key}`; }

const CHANGE_WIDTH = 880;
const CHANGE_MARGIN = 64;
let measureCtx = null;
function getMeasureCtx(){ if (!measureCtx){ const c = document.createElement("canvas"); measureCtx = c.getContext("2d"); } return measureCtx; }

async function packChangeLines(text, maxLines, baseFontSize, lineHeight, k){
  const innerWidth = CHANGE_WIDTH * k;
  const ctx = getMeasureCtx();
  let fontSize = baseFontSize;
  let lh = lineHeight;
  const minFontSize = baseFontSize * 0.85;
  
  await document.fonts.ready;
  await document.fonts.load(`400 ${fontSize * k}px Lato`);
  
  const pack = (fs, lh) => {
    ctx.font = `400 ${fs * k}px Lato`;
    const phrases = text.split(" · ");
    const sep = " · ";
    const sepW = ctx.measureText(sep).width;
    const lines = [];
    let cur = "", curW = 0;
    for (const p of phrases){
      const pW = ctx.measureText(p).width;
      if (cur === ""){ cur = p; curW = pW; }
      else if (curW + sepW + pW <= innerWidth){ cur += sep + p; curW += sepW + pW; }
      else { lines.push(cur); cur = p; curW = pW; }
    }
    if (cur) lines.push(cur);
    return { lines, fs, lh };
  };
  
  let result = pack(fontSize, lh);
  while (result.lines.length > maxLines && fontSize > minFontSize){
    fontSize -= 1;
    lh = Math.round(lineHeight * fontSize / baseFontSize);
    result = pack(fontSize, lh);
  }
  return result;
}
const REVEAL_OK = new Map();
function revealAvailable(line, key){

async function packAndRenderChange(){

function getT(video){
  const shift = video.duration > 14.5 ? video.duration - 14.02 : 0;
  return x => x + (x > 4.6 ? shift : 0);
}

function onRevealTime(){
  const video = $("#rvVideo"), ra = revealActive;
  if (!video || !ra) return;
  const T = getT(video), t = video.currentTime;
  if (!ra.skipUnlocked && t >= T(6.10)){
    ra.skipUnlocked = true;
    const hit = $("#rvHit"); if (hit) hit.classList.remove("locked");
  }
  if (!ra.cardStarted && t >= T(10.25)){
    ra.cardStarted = true;
    const card = $("#rvCard");
    if (card){
      const panelH = ra.panelH || 600;
      const k = parseFloat(card.style.getPropertyValue("--k")) || 1;
      const fullD = (2280 - (1742 - panelH/2)) * k;
      const late = Math.max(0, t - T(10.25));
      const progress = Math.min(1, late / 0.6);
      const startD = fullD * (1 - progress);
      const remainDur = Math.max(0.05, 0.6 - late);
      const startOpacity = Math.min(1, late / 0.375);
      card.style.transition = "none";
      card.style.transform = `translateY(${startD}px)`;
      card.style.opacity = String(startOpacity);
      card.offsetHeight;
      card.style.transition = `transform ${remainDur}s cubic-bezier(.215,.61,.355,1), opacity ${Math.min(0.375, remainDur)}s`;
      card.classList.add("show");
      card.style.transform = "translateY(0)";
      card.style.opacity = "1";
    }
  }
  if (!ra.continueEnabled && t >= T(12.45)){
    ra.continueEnabled = true;
    const btn = $("#rvContinue"); if (btn){ btn.hidden = false; btn.focus(); }
    markRevealSeen();
  }
  if (t >= T(12.95) && !ra.payoffReady){
    ra.payoffReady = true;
    const hit = $("#rvHit"); if (hit) hit.style.pointerEvents = "none";
  }
}

function onRevealEnded(){
  const ra = revealActive;
  if (!ra) return;
  ra.payoffReady = true;
  const btn = $("#rvContinue");
  if (btn && btn.hidden){ btn.hidden = false; btn.focus(); }
  const hit = $("#rvHit"); if (hit) hit.style.pointerEvents = "none";

function skipReveal(){

  ra.cardStarted = true;
  ra.payoffReady = true;
  ra.continueEnabled = true;
  if (video){
    video.style.opacity = "1";
    const T = getT(video);
    video.currentTime = T(12.95);
    video.play().catch(() => {});
  }
  const card = $("#rvCard");
  if (card){ card.style.transition = "none"; card.style.transform = ""; card.style.opacity = "1"; card.classList.add("show"); }
  const btn = $("#rvContinue"); if (btn){ btn.hidden = false; btn.focus(); }

function markRevealSeen(){
  const ra = revealActive;
  if (!ra || ra.markedSeen) return;

let shown = 0, raf;
function countTo(n){
  cancelAnimationFrame(raf);
  const from = shown, t0 = performance.now(), dur = Math.min(900, 300 + Math.abs(n-from)/4);
  const el = $("#balance");
  const step = now => {
    const k = Math.min(1, (now - t0)/dur), e = 1 - Math.pow(1-k, 3);
    shown = from + (n - from)*e; el.textContent = fmt(shown);
    if (k < 1) raf = requestAnimationFrame(step); else shown = n;
  };
  if (matchMedia("(prefers-reduced-motion: reduce)").matches){ shown = n; el.textContent = fmt(n); return; }
  raf = requestAnimationFrame(step);
}
function affordScene(){
  if (sceneOpen(S.scene)) return S.scene;

  const s = affordScene(), sc = SCENES[s], stock = itemsIn(s);

  if (can.length <= 2) return `Enough for ${listJoin(can.map(i => i.name))} at the ${sc.name}.`;

/* Embers (spec §10): 0.6–1.2 spawns a second while the Nest is open, at most 24 alive, each living
   4–7 s, rising 12–30 px/s with a sine sway. Most rise along the edges; about one in seven drifts behind the cabinet. */
let emT = 0;
function spawnEmber(seed){
  const stage = $("#nestBody .hx-in");
  if (!stage || stage.querySelectorAll(".em").length >= 24) return;
  const R = (a, b) => a + Math.random() * (b - a), u = stage.offsetWidth / 390;
  if (!u) return;
  const H = stage.offsetHeight / u;
  const back = Math.random() < .15;
  const x = back ? R(40, 350) : Math.random() < .5 ? R(0, 30) : R(360, 390), y = R(.4 * Math.min(H, 844), H);
  const life = R(4, 7), rise = R(12, 30) * life, amp = R(6, 14), per = R(2, 4), sc = R(.5, 1.2);
  const el = document.createElement("i");
  el.className = "em"; el.style.zIndex = back ? 1 : 17;
  el.style.left = `calc(${(x - 12).toFixed(1)}*var(--u))`; el.style.top = `calc(${(y - 12).toFixed(1)}*var(--u))`;
  el.innerHTML = `<img src="${NA}ember_0${1 + Math.floor(Math.random() * 6)}.webp" alt="">`;
  stage.appendChild(el);
  const a = el.animate([{transform:"translateY(0)", opacity:0}, {opacity:1, offset:.4 / life}, {opacity:1, offset:(life - 1.5) / life}, {transform:`translateY(${(-rise * u).toFixed(1)}px)`, opacity:0}],
    {duration:life * 1000, easing:"linear"});
  el.firstChild.animate([{transform:`translateX(${(-amp * u).toFixed(1)}px) scale(${sc.toFixed(2)})`}, {transform:`translateX(${(amp * u).toFixed(1)}px) scale(${sc.toFixed(2)})`}],
    {duration:per * 500, direction:"alternate", iterations:Infinity, easing:"ease-in-out", delay:-Math.random() * per * 1000});
  if (seed) a.currentTime = Math.random() * life * 1000;
  a.onfinish = () => el.remove();
}
function syncEmbers(){
  const on = S.tab === "nest" && !matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (on && !emT){
    for (let i = 0; i < 4; i++) spawnEmber(true);
    const tick = () => { if (S.tab !== "nest"){ emT = 0; return; } spawnEmber(false); emT = setTimeout(tick, 1000 / (0.6 + Math.random() * 0.6)); };
    emT = setTimeout(tick, 900);
  } else if (!on && emT){ clearTimeout(emT); emT = 0; }
}

function syncKeepCover(){
  if (!keepOn()) return;
  const tabs = $(".tabs"), app = $("#app"), keep = $("#keep");
  if (!tabs || !app) return;
  const cover = app.getBoundingClientRect().bottom - tabs.getBoundingClientRect().top;
  if (cover > 0) app.style.setProperty("--keep-cover", Math.ceil(cover) + "px");
  if (!keep || typeof getComputedStyle !== "function") return;
  const frame = getComputedStyle(tabs, "::before");
  const ornament = parseFloat(frame.top);
  const border = parseFloat(frame.borderTopWidth);
  const lift = (isFinite(ornament) && ornament < 0 ? -ornament : 0) + (isFinite(border) ? border : 0);
  keep.style.setProperty("--keep-tab", Math.max(8, Math.ceil(lift)) + "px");
}
function keepScrollPad(){
  const tabs = $(".tabs");
  if (!tabs || typeof getComputedStyle !== "function") return 16;
  const rect = tabs.getBoundingClientRect();
  const frame = getComputedStyle(tabs, "::before");
  const ornament = parseFloat(frame.top);
  const border = parseFloat(frame.borderTopWidth);
  const lift = (isFinite(ornament) && ornament < 0 ? -ornament : 0) + (isFinite(border) ? border : 0);
  return Math.ceil(rect.height + lift + 16);
}

/* Debug URL params: ?debug=1&xp=N sets prize dragon xp, &dragon=line picks dragon, &eggsteps=N sets eggs' steps-left */
function applyDebugParams(){
  if (!DEBUG) return;
  const params = new URLSearchParams(location.search);
  const xpVal = params.get("xp");
  const dragonLine = params.get("dragon");
  const eggStepsLeft = params.get("eggsteps");

  /* Select dragon by line if specified */
  if (dragonLine){
    const d = S.dragons.find(x => x.line === dragonLine.toLowerCase());
    if (d){ S.prize = d.id; }
  }

  /* Set xp on prize dragon */
  if (xpVal !== null){
    const p = prizeDragon();
    if (p){ p.xp = Math.max(0, parseInt(xpVal, 10) || 0); }
  }

  /* Set egg steps-left */
  if (eggStepsLeft !== null){
    const left = Math.max(0, parseInt(eggStepsLeft, 10) || 0);
    S.eggs.forEach(e => { e.at = S.lifetime - (ITEM[e.item].hatch - left); });
  }

  save();
}

const OLD_EGG = {ember:"ember", tide:"tide", forest:"forest", frost:"tide", inferno:"inferno", storm:"storm", void:"void", tempest:"tempest"};
const OLD_SPECIES = ["Cinder","Soot","Brine","Kelp","Moss","Fernback","Frostling","Rimeback","Inferno","Cinderking","Stormling","Pearl Stormling","Voidling","Starveil","Tempest","Stormcrown"];
function migrate(){
  S.eggs = asList(S.eggs).filter(e => e && typeof e === "object" && !Array.isArray(e));
  S.dragons = asList(S.dragons).filter(d => d && typeof d === "object" && !Array.isArray(d));
  S.owned = asMap(S.owned);
  S.bought = asMap(S.bought);

  S.dragons.forEach(d => {
    if (!ITEM[d.item] || ITEM[d.item].kind !== "egg") d.item = OLD_EGG[d.item] || "ember";
    if (!d.line || !DRAGONS[d.line]){
      d.line = ITEM[d.item].line;
      const sp = DRAGONS[d.line].name;
      if (!d.name || OLD_SPECIES.includes(d.name)) d.name = sp;
      d.species = sp;
    }
    if (d.mut && !MUTATIONS[d.mut]) d.mut = null;
    if (d.trail && !ITEM[d.trail]) d.trail = null;
    if (!d.reveals) d.reveals = {};

  Object.keys(S.owned).forEach(k => { if (!ITEM[k]) delete S.owned[k]; });
  Object.keys(S.bought).forEach(k => { if (!ITEM[k]) delete S.bought[k]; });

/* Dragon Keep. Highest stage, then highest rarity, then id. Each id once: six roaming, the rest stabled. */
const RARITY_RANK = {Common:0, Uncommon:1, Rare:2, Epic:3, Legendary:4};
function dragonKey(d){ return d && typeof d === "object" ? idKey(d.id) : null; }
function rarityRank(d){
  const it = d && ITEM[d.item];
  const r = it && RARITY_RANK[it.rarity];
  return r == null ? -1 : r;
}
function migrateV4(){
  try {
    const owned = [];
    asList(S.dragons).forEach((d, i) => {
      const id = dragonKey(d);
      if (id == null) return;
      const prev = owned.find(o => o.id === id);
      if (!prev){ owned.push({id, d, i}); return; }
      const better = stageIdx(d) > stageIdx(prev.d) || (stageIdx(d) === stageIdx(prev.d) && rarityRank(d) > rarityRank(prev.d));
      if (better){ prev.d = d; prev.i = i; }
    });
    const keep = normKeep(S.keep);
    const placed = keep.roaming.concat(keep.stables);
    const placedSet = new Set(placed);
    const exact = placed.length === owned.length && placedSet.size === placed.length && owned.every(o => placedSet.has(o.id));
    if (!exact){
      owned.sort((a, b) => {
        const ds = stageIdx(b.d) - stageIdx(a.d); if (ds) return ds;
        const dr = rarityRank(b.d) - rarityRank(a.d); if (dr) return dr;
        if (a.id < b.id) return -1;
        if (a.id > b.id) return 1;
        return a.i - b.i;
      });
      const ids = owned.map(o => o.id);
      keep.roaming = ids.slice(0, 6);
      keep.stables = ids.slice(6);
      keep.zones = [];
      keep.care = {};
      keep.streak = {last:null, count:0, best:0};
      keep.restDay = 0;
    }
    S.keep = keep;
  } catch(e){ S.keep = freshKeep(); }
}

/* Owned dragon ids live in roaming (up to 6) or stables, each id once. Existing order stays. */
function reconcileKeep(){
  try {
    const keep = normKeep(S.keep);
    const owned = [];
    const ownedSet = new Set();
    asList(S.dragons).forEach(d => {
      const id = dragonKey(d);
      if (id == null || ownedSet.has(id)) return;
      ownedSet.add(id);
      owned.push(id);
    });
    const roaming = [];
    const stables = [];
    const placed = new Set();
    const take = (id, list) => {
      if (!ownedSet.has(id) || placed.has(id)) return;
      placed.add(id);
      list.push(id);
    };
    keep.roaming.forEach(id => take(id, roaming));
    keep.stables.forEach(id => take(id, stables));
    owned.forEach(id => {
      if (placed.has(id)) return;
      placed.add(id);
      if (roaming.length < 6) roaming.push(id);
      else stables.push(id);
    });
    keep.roaming = roaming;
    keep.stables = stables;
    S.keep = keep;
  } catch(e){
    if (!S.keep || typeof S.keep !== "object" || Array.isArray(S.keep)) S.keep = freshKeep();
  }
}
/* One write for a keep move. save() reconciles, so the two lists stay a partition of owned ids, roaming at most 6. */
function moveKeep(op, id, other){
  const a = idKey(id), b = idKey(other);
  const keep = normKeep(S.keep);
  const roaming = keep.roaming.slice(), stables = keep.stables.slice();
  const owned = new Set();
  asList(S.dragons).forEach(d => { const k = dragonKey(d); if (k != null) owned.add(k); });
  const has = (list, k) => k != null && list.indexOf(k) >= 0;
  let nextR = roaming, nextS = stables, ok = false;
  if (op === "send" && has(stables, a) && !has(roaming, a) && owned.has(a) && roaming.length < 6){
    nextS = stables.filter(k => k !== a); nextR = roaming.concat(a); ok = true;
  } else if (op === "rest" && has(roaming, a) && !has(stables, a) && owned.has(a)){
    nextR = roaming.filter(k => k !== a); nextS = stables.concat(a); ok = true;
  } else if (op === "swap" && a !== b && has(roaming, a) && !has(stables, a) && has(stables, b) && !has(roaming, b) && owned.has(a) && owned.has(b)){
    nextR = roaming.map(k => k === a ? b : k); nextS = stables.map(k => k === b ? a : k); ok = true;
  }
  if (!ok) return false;
  keep.roaming = nextR; keep.stables = nextS; S.keep = keep;

}

  const [y, m, d] = s.split("-").map(Number);
  const dt = new Date(y, m - 1, d);

function careRecord(id){
  const bag = S.keep && S.keep.care;
  const c = bag && typeof bag === "object" ? bag[id] : null;
  const bond = c && Number.isFinite(+c.bond) ? Math.max(0, Math.min(100, Math.round(+c.bond))) : 0;
  return {fed: careStamp(c && c.fed), groomed: careStamp(c && c.groomed), petted: careStamp(c && c.petted), bond};
}
function careLeft(ms){
  if (ms <= 0) return "Ready";
  const h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000);
  if (h && m) return h + "h " + m + "m";
  if (h) return h + "h";
  if (m) return m + "m";
  return Math.max(1, Math.ceil(ms / 1000)) + "s";
}
/* A stamp ahead of the clock is not ready. The wait is the full cooldown, never more. */
function careWait(last, t, ms){
  if (last == null || !(ms > 0)) return 0;
  if (t < last) return ms;
  const left = last + ms - t;
  if (left <= 0) return 0;
  return left > ms ? ms : left;
}
/* Pull future stamps back to now and save, so a rolled-back clock starts one full cooldown. */
function careClamp(id){
  const key = idKey(id);
  if (key == null || !S.dragons.some(d => dragonKey(d) === key)) return null;
  if (!S.keep || typeof S.keep !== "object" || Array.isArray(S.keep)) S.keep = freshKeep();
  if (!S.keep.care || typeof S.keep.care !== "object" || Array.isArray(S.keep.care)) S.keep.care = {};
  const cur = careRecord(key);
  const t = now();
  const next = {fed: cur.fed, groomed: cur.groomed, petted: cur.petted, bond: cur.bond};
  let changed = false;
  Object.keys(CARE_ACTS).forEach(kind => {
    const field = CARE_ACTS[kind].key;
    if (next[field] != null && t < next[field]){ next[field] = t; changed = true; }
  });
  if (changed){ S.keep.care[key] = next; save(); }
  return key;
}
function careSeals(d){
  return d && d.mut && MUTATIONS[d.mut] ? [d.mut] : [];
}
function keeperNotes(id){
  const d = id && typeof id === "object" ? id : S.dragons.find(x => dragonKey(x) === id);
  const list = (d && KEEPER_NOTES[d.line]) || [];
  const bond = careRecord(d ? dragonKey(d) : id).bond;
  return NOTE_AT.map((at, i) => ({at, open: bond >= at && !!list[i], text: bond >= at && list[i] ? list[i] : "Keep caring to learn more"}));
}
/* One save for a care action. Bond rises by one, capped at 100. A cooldown writes nothing. */
function careAct(id, kind){
  const spec = CARE_ACTS[kind];
  const key = careClamp(id);
  if (!spec || key == null) return false;
  const cur = careRecord(key);
  const t = now();
  if (careWait(cur[spec.key], t, spec.ms) > 0) return false;
  const next = {fed: cur.fed, groomed: cur.groomed, petted: cur.petted, bond: Math.min(100, cur.bond + 1)};
  next[spec.key] = t;
  S.keep.care[key] = next;
  save();
  return true;
}
let careFor = null, careReturn = null;
function openCare(id){
  if (!keepOn()) return;
  const d = S.dragons.find(x => dragonKey(x) === idKey(id));
  if (!d) return;
  careFor = dragonKey(d);
  const prev = document.activeElement;
  careReturn = prev && prev !== document.body ? prev : null;
  renderCare(false);
  const ov = $("#careOv");
  ov.hidden = false;
  const first = focusables(ov)[0];
  if (first) first.focus();
}
function closeCare(opts){
  const ov = $("#careOv");
  if (!ov || ov.hidden) return;
  ov.hidden = true;
  const back = careReturn;
  careReturn = null;
  careFor = null;
  if (opts && opts.restore === false) return;
  if (back && back.isConnected) back.focus();
}
function renderCare(hop){
  const body = $("#careBody");
  const d = S.dragons.find(x => dragonKey(x) === careFor);
  if (!body || !d) return;
  careClamp(d.id);
  const rec = careRecord(d.id);
  const t = now();
  const acts = Object.keys(CARE_ACTS).map(kind => {
    const spec = CARE_ACTS[kind];
    const left = careWait(rec[spec.key], t, spec.ms);
    const ready = left <= 0;
    return `<button type="button" class="btn${ready ? "" : " ghost"}" data-act="care-do" data-kind="${kind}"${ready ? "" : " disabled"}>${spec.label}<small>${ready ? "Ready" : careLeft(left)}</small></button>`;
  }).join("");
  const seals = careSeals(d).map(m =>
    `<span class="wax acc-${m}" role="img" aria-label="${esc(MUTATIONS[m].name)} mutation">${esc(MUTATIONS[m].name.slice(0, 1))}</span>`).join("");
  const notes = keeperNotes(d).map(n => `<p class="care-note${n.open ? "" : " locked"}">${esc(n.text)}</p>`).join("");
  body.innerHTML = `<div class="care-top${hop ? " is-happy" : ""}"><div>${dragonArt(d)}</div><div><p class="care-name">${esc(d.name || d.species)}</p><div class="ldg-meta">${esc(STAGES[stageIdx(d)].name)} \u00B7 <span class="r ${rcls(rarityOf(d))}">${esc(rarityOf(d))}</span></div><div class="bond" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${rec.bond}" aria-label="Bond ${rec.bond} of 100"><i style="width:${rec.bond}%"></i></div><div class="bond-n">Bond ${rec.bond} / 100</div></div></div>${seals ? `<div class="wax-row">${seals}</div>` : ""}${hop ? `<p class="care-pleased" role="status">It looks pleased.</p>` : ""}<div class="care-acts">${acts}</div><h3>Keeper's Notes</h3>${notes}`;
}
function start(data){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e){}
  const injected = !!(data && data.state);
  let corrupt = false;
  if (!injected && raw != null){ try { JSON.parse(raw); } catch(e){ corrupt = true; } }
  if (corrupt) backupCorrupt(raw);
  S = injected ? hydrate(data.state) : (load() || fresh());
  if (!S.opened || typeof S.opened !== "object" || Array.isArray(S.opened)) S.opened = {};
  const migrating = corrupt || (S.ver || 1) < 4;
  if (migrating) backupV3(raw);
  try {
    migrate();
    if ((S.ver || 1) < 3){ migrateV3(); S.ver = 3; }
    if ((S.ver || 1) < 4){ migrateV4(); S.ver = 4; }
  } catch(e){ S = fresh(); }
  reconcileKeep();
  if (migrating) save();
  ITEMS.forEach(it => { if (S.owned[it.id]) for (let k = 1; k <= it.scene; k++) S.opened[k] = true; });
  applyDebugParams();
  noteDailyVisit();
  syncKeepCover();
  shown = S.bank;
  $("#balance").textContent = fmt(S.bank);
  buildScenes();
  if (DEBUG) debugPanel();
  setTab(S.tab || "bank");
  loadMutArt();
  setTimeout(autoHatch, 600);
}
try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({state: S})); } catch(e){}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start(window.claude && window.claude.hot && window.claude.hot.data || {});
})();
</script>
