<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Scale Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Albert+Sans:wght@400;500;600;700&family=Lato:wght@400;700;900&family=Cormorant+Garamond:wght@600&display=swap">
<style>
/* Layout: one-column phone app, three screens over a fixed bottom tab bar; vendors swipe sideways with scroll-snap. */
:root{
  --ink:#0c1015;        /* wet stone at night */
  --stone:#151b22;
  --stone-2:#1e262f;
  --line:#2c3540;
  --fg:#efe5d1;         /* lantern paper */
  --muted:#9c978b;
  --gold:#d8a94b;
  --gold-hi:#f4d78f;
  --gold-lo:#7b5517;
  --lantern:#e2583e;
  --jade:#6fbf9f;
  --display:"Gloock","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --body:"Albert Sans","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--ink)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--ink);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--ink);border-inline:1px solid transparent}
@media (min-width:500px){#app{border-inline-color:var(--line)}}
.screen{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.pad{padding-inline:16px}

/* ---------- tab bar ---------- */
.tabs{flex:none;position:relative;display:grid;grid-template-columns:repeat(4,1fr);margin:0 8px 6px;padding:6px 0 4px;font-family:"Lato",var(--body)}
.tabs::before{content:"";position:absolute;inset:-6px;pointer-events:none;border-style:solid;border-width:26px 24px;border-image:url(art/nest/nav_bar_bg.webp) 78 72 fill / 26px 24px stretch}
.tab{position:relative;background:none;border:0;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#c3b197;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tab .ti{width:30px;height:30px;display:block}
.tab .ti.on,.tab[aria-current="page"] .ti.off{display:none}
.tab[aria-current="page"] .ti.on{display:block}
.tab[aria-current="page"]{color:#eeca74}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-8px;left:50%;width:50px;height:12px;transform:translateX(-50%);background:url(art/nest/nav_active_underline.webp) center/contain no-repeat}
.tab .dot{position:absolute;top:0;left:calc(50% + 5px);width:20px;height:20px;animation:dotpulse 1.6s ease-in-out infinite}
@keyframes dotpulse{0%,100%{opacity:.7}50%{opacity:1}}

/* ---------- shared bits ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.topbar h1{font-family:var(--display);font-weight:400;font-size:24px;margin:0;letter-spacing:.01em}
.chip{display:inline-flex;align-items:baseline;gap:5px;padding:5px 11px;border-radius:999px;border:1px solid var(--gold-lo);background:var(--stone);font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;color:var(--gold-hi);white-space:nowrap}
.chip small{font-weight:500;color:var(--muted);font-size:12px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.btn{border:1px solid var(--gold);background:linear-gradient(180deg,#e8bd5f,#b9862e);color:#1b1206;font-weight:700;border-radius:12px;padding:12px 16px;letter-spacing:.01em;box-shadow:inset 0 1px 0 rgba(255,240,200,.5),0 2px 0 #5c3d0c}
.btn:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,240,200,.5),0 1px 0 #5c3d0c}
.btn.ghost{background:transparent;color:var(--gold-hi);box-shadow:none;border-color:var(--gold-lo)}
.btn[disabled]{background:var(--stone-2);border-color:var(--line);color:var(--muted);box-shadow:none;cursor:default}
.toast{position:absolute;left:16px;right:16px;top:12px;z-index:30;background:#1b2229;border:1px solid var(--gold-lo);color:var(--fg);padding:11px 14px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:14px;transform:translateY(-140%);transition:transform .3s ease}
.toast.show{transform:none}

/* ---------- bank ---------- */
#bank{display:flex;flex-direction:column;background:radial-gradient(120% 60% at 50% -10%,rgba(216,169,75,.10),transparent 60%),var(--ink)}
.bank-main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px;padding-block:24px}
.balance{font-family:var(--display);font-size:clamp(64px,22vw,104px);line-height:1;letter-spacing:-.01em;color:var(--fg);font-variant-numeric:tabular-nums;text-shadow:0 0 40px rgba(216,169,75,.18)}
.balance-unit{font-size:15px;color:var(--gold);letter-spacing:.2em;text-transform:uppercase;font-weight:600}
.afford{max-width:30ch;margin:18px auto 0;color:var(--fg);opacity:.82;font-size:15px;text-wrap:balance}
.lifetime{margin-top:22px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lifetime b{color:var(--fg);font-weight:600}
.bank-foot{padding-block:8px 18px;display:flex;flex-direction:column;gap:10px}
.step-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.step-btns .btn{padding:15px 10px;font-size:16px}
.sim-note{text-align:center;font-size:12px;color:var(--muted)}
.reset{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:3px;padding:4px;align-self:center}
.reset.armed{color:var(--lantern)}

/* ---------- vendors ---------- */
#vendors{display:flex;flex-direction:column;overflow:hidden}
.vrail{position:relative;flex:none;display:grid;grid-template-columns:repeat(3,1fr);margin:12px 16px 6px;padding:4px;background:var(--stone);border:1px solid var(--line);border-radius:14px}
.vtab{position:relative;z-index:1;background:none;border:0;padding:7px 4px 6px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);min-width:0;transition:color .2s}
.vtab b{font-family:var(--display);font-weight:400;font-size:15px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.vtab small{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:inline-flex;gap:3px;align-items:center;opacity:.85}
.vtab small svg{width:10px;height:10px}
.vtab[aria-selected="true"]{color:var(--gold-hi)}
.vtab.locked b{opacity:.7}
.vind{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / 3);border-radius:10px;background:linear-gradient(180deg,rgba(216,169,75,.24),rgba(216,169,75,.07));border:1px solid var(--gold-lo);transform:translateX(calc(var(--p,0) * 100%));pointer-events:none}
.scenes{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.scenes::-webkit-scrollbar{display:none}
.scene{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;padding-inline:16px;padding-block:2px 24px}
.art{position:relative;aspect-ratio:6/5;max-width:100%;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:inset 0 0 0 1px rgba(216,169,75,.18);background:#0b0d10}
.art > video{display:block;width:100%;height:100%;object-fit:cover;object-position:var(--pos,50% 50%)}
.scene.is-locked .art > video{filter:grayscale(.65) brightness(.55)}
.art .shade{position:absolute;inset:auto 0 0 0;height:58%;background:linear-gradient(180deg,transparent,rgba(8,10,13,.92));pointer-events:none}
.vtitle{position:absolute;left:14px;right:14px;bottom:12px;pointer-events:none}
.vtitle .eyebrow{color:#d9cfbd}
.vtitle h2{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.05;margin:3px 0 3px;color:#fff6e6;text-wrap:balance;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.quip{margin:0;color:#d4cab8;font-style:italic;font-size:13px}
.lockbadge{position:absolute;inset:10px 10px auto auto;display:flex;align-items:center;gap:6px;background:rgba(12,16,21,.85);border:1px solid var(--gold-lo);color:var(--gold-hi);padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.vnav{position:absolute;top:38%;transform:translateY(-50%);width:40px;height:40px;padding:0;border-radius:50%;border:1px solid rgba(244,215,143,.55);background:rgba(10,12,16,.62);color:var(--gold-hi);display:grid;place-items:center;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.vnav svg{width:18px;height:18px}
.vnav.prev{left:8px}.vnav.next{right:8px}
.vtools{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;margin-inline:-16px;padding:10px 16px 8px;background:linear-gradient(var(--ink) 78%,rgba(12,16,21,0))}
.fchips{display:flex;gap:5px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-mask:linear-gradient(90deg,#000 88%,transparent);mask:linear-gradient(90deg,#000 88%,transparent);padding-right:14px}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;display:inline-flex;align-items:baseline;gap:4px;padding:6px 9px;border-radius:999px;border:1px solid var(--line);background:var(--stone);color:var(--fg);font-size:12.5px;font-weight:600}
.fchip i{font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.fchip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-hi);background:rgba(216,169,75,.12)}
.vtools .chip{flex:none;padding:5px 10px;align-items:center;gap:5px}
.ghead{display:flex;align-items:baseline;gap:8px;margin:14px 0 8px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.ghead::after{content:"";flex:1;height:1px;background:var(--line);align-self:center}
.ghead + .list{margin-top:0}
.lockcard{margin-top:12px;border:1px solid var(--gold-lo);background:linear-gradient(180deg,rgba(216,169,75,.08),rgba(216,169,75,.02));border-radius:14px;padding:14px}
.lockcard p{margin:0 0 10px}
.missing{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.missing li{display:flex;justify-content:space-between;gap:12px;font-weight:600}
.missing li span:last-child{font-variant-numeric:tabular-nums;color:var(--gold-hi);white-space:nowrap}
.lockcard .btn{margin-top:12px;width:100%}
.list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.list.teaser{opacity:.45;pointer-events:none}
.item{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--stone);border:1px solid var(--line)}
.item.owned{background:transparent}
.thumb{position:relative;width:76px;height:76px;display:grid;place-items:center;border-radius:12px;background:radial-gradient(70% 60% at 50% 70%,#2a221a,#14181e);border:1px solid #2a2a26;overflow:hidden}
.thumb .shopegg{position:absolute;left:50%;top:50%;width:92px;height:92px;max-width:none;transform:translate(-50%,-58%)}
.thumb .dart.tthumb{position:absolute;inset:0;width:auto;aspect-ratio:auto;background:none;border-radius:0}
.thumb .dart.tthumb::after{display:none}
.kind{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.kind.r-uncommon{color:#93cf86}
.kind.r-rare,.r.r-rare{color:#b9b6f0}
.kind.r-epic,.r.r-epic{color:#d6a2ff}
.kind.r-legendary,.r.r-legendary{color:#ffd27a;text-shadow:0 0 10px rgba(255,200,100,.45)}
.r.r-common{color:var(--gold)} .r.r-uncommon{color:#93cf86}
.odds{display:flex;flex-wrap:wrap;gap:4px 6px;margin:-2px 0 9px}
.odds span{font-size:11px;color:var(--muted);background:var(--ink);border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-variant-numeric:tabular-nums}
.odds b{color:var(--fg);font-weight:600}
.odds .mut{border-color:rgba(190,160,255,.45);color:#cdb8ff}
.odds .mut b{color:#e6dcff}
.buyrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bought{font-size:12px;color:var(--jade);font-weight:600}
.iname{font-family:var(--display);font-size:19px;line-height:1.2;margin:1px 0 2px}
.hint{font-size:13px;color:var(--muted);margin:0 0 8px}
.buy{min-width:118px;padding:8px 12px;border-radius:10px;font-variant-numeric:tabular-nums;text-align:left;display:inline-flex;flex-direction:column;line-height:1.2}
.buy small{font-weight:500;font-size:11px;opacity:.85}
.buy.confirm{background:linear-gradient(180deg,#f07a5e,#c2412a);border-color:#f3a08b;color:#fff;box-shadow:inset 0 1px 0 rgba(255,220,200,.4),0 2px 0 #6a1b0f}
.owned-tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--jade)}
.empty-stock{margin-top:14px;padding:22px 16px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}

/* ---------- dragon screen ---------- */
.frame{position:relative;margin-top:4px;border-radius:20px;padding:18px 16px 18px;text-align:center;background:radial-gradient(80% 55% at 50% 45%,rgba(216,169,75,.16),transparent 70%),linear-gradient(180deg,#19140f,#101318);border:1px solid var(--gold-lo);box-shadow:inset 0 0 0 4px #0f1216,inset 0 0 0 5px rgba(216,169,75,.35)}
.plaque{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#1b1206;background:linear-gradient(180deg,var(--gold-hi),var(--gold));padding:4px 12px;border-radius:4px}
.stage{display:grid;place-items:center;margin-block:4px}
.stage .dart{width:min(240px,62vw)}
.pname{font-family:var(--display);font-size:30px;line-height:1.1;margin:0;overflow-wrap:anywhere}
.species{font-size:13px;color:var(--muted)}
.frame.empty .stage{position:relative;width:min(240px,62vw);margin-inline:auto}
.padlock{position:absolute;inset:0;display:grid;place-items:center}
.padlock svg{width:54px;height:54px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.6))}
.frame.empty .pname{color:var(--muted)}
.frame.empty p{margin:8px auto 14px;max-width:32ch;color:var(--fg);opacity:.85;text-wrap:balance}
.section{margin-top:22px}
.section h2{font-family:var(--display);font-weight:400;font-size:21px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.section h2 small{font-family:var(--body);font-size:12px;color:var(--muted)}
.custom{display:flex;flex-direction:column;gap:14px;background:var(--stone);border:1px solid var(--line);border-radius:16px;padding:14px}
.crow{display:flex;flex-direction:column;gap:7px}
.crow label,.crow .lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.crow input{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);font:inherit;font-size:16px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--ink);font-size:14px;font-weight:600}
.opt[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-hi);background:rgba(216,169,75,.1)}
.sw{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.25)}
.none-note{font-size:13px;color:var(--muted);margin:0}
.share-btn{width:100%;margin-top:14px;padding:14px;font-size:16px}
/* ---------- nest (asset pack, SPEC.md) ---------- */
#nest{padding-inline:0;background:#03060b url(art/nest/background.webp) center top/cover no-repeat}
.hx{container-type:inline-size;width:100%}
.hx-in{--u:calc(100cqw / 390);position:relative;width:100%;font-family:"Lato",var(--body)}
.hx-in > *{position:absolute}
.hx-in img{display:block;user-select:none;-webkit-user-drag:none}
.hx-banner{background:url(art/nest/banner_panel.webp) center/100% 100% no-repeat;display:flex;align-items:center;padding:0 calc(30*var(--u)) 0 calc(29.5*var(--u))}
.hx-banner p{margin:0;font-size:calc(16*var(--u));line-height:calc(21*var(--u));color:#f5e5c1;text-shadow:0 calc(.6*var(--u)) calc(.8*var(--u)) rgba(0,0,0,.6);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hx-cab-back{border-style:solid;border-width:calc(24*var(--u)) calc(22*var(--u)) calc(30*var(--u));border-image:url(art/nest/cabinet_back.webp) 72 66 90 fill / calc(24*var(--u)) calc(22*var(--u)) calc(30*var(--u)) stretch;box-sizing:border-box}
.hx-cab-frame{pointer-events:none;border-style:solid;border-image:url(art/nest/cabinet_frame.webp) 168 102 126 / calc(56*var(--u)) calc(34*var(--u)) calc(42*var(--u)) stretch;border-width:calc(56*var(--u)) calc(34*var(--u)) calc(42*var(--u));box-sizing:border-box;z-index:6}
.hx-shelf{z-index:2}
.hx-conn{z-index:4}
.hx-ring{z-index:1;overflow:hidden;pointer-events:none;animation:ringin .6s cubic-bezier(.33,1,.68,1) both}
.hx-ring > img{width:100%;height:100%;animation:spin 4s linear infinite}
/* The 12x8 sprite sheet is stepped by background position, so only the ring's own box is ever
   painted (moving a transformed sheet 12x8 times its size is too large a layer for Safari). */
.hx-ring .rs{width:100%;height:100%;background:url(art/nest/ring_sheet.webp) 0 0/1200% 800% no-repeat;animation:rsx .5s steps(12) infinite,rsy 4s steps(8) infinite}
@keyframes rsx{to{background-position-x:109.0909%}}
@keyframes rsy{to{background-position-y:114.2857%}}
@keyframes ringin{from{opacity:0;transform:scale(.85)}}
@keyframes spin{to{transform:rotate(360deg)}}
.hx-slot{z-index:3;padding:0;border:0;background:none;cursor:pointer;transform-origin:50% 96%;transition:transform .12s}
.hx-slot img{position:relative;width:100%;height:100%}
.hx-slot:active{transform:scale(.96)}
.hx-slot .glow{position:absolute;left:10%;right:10%;top:0;bottom:12%;border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,rgba(255,176,90,calc(.05 + var(--p) * .22)),transparent)}
.hx-slot.sel .glow{background:radial-gradient(closest-side,rgba(255,214,130,calc(.22 + var(--p) * .2)),transparent);box-shadow:0 calc(30*var(--u)) calc(20*var(--u)) calc(-14*var(--u)) rgba(244,215,143,.55)}
.hx-slot.ready{animation:eggwobble 3.1s ease-in-out infinite}
@keyframes eggwobble{0%{transform:rotate(0)}6%{transform:rotate(-4deg) scale(1.02,.98)}12%{transform:rotate(4deg)}18%{transform:rotate(-2.5deg)}24%{transform:rotate(1.5deg)}29%,100%{transform:rotate(0)}}
.hx-slot.empty{z-index:3;opacity:.55;pointer-events:none}
.hx-slot:focus-visible{outline:2px solid var(--gold-hi);outline-offset:-4px;border-radius:24%}
.hx-tube{z-index:5}
.hx-tube > img,.hx-tube .sheen{position:absolute;inset:0;width:100%;height:100%}
.hx-tube .sheen{background:linear-gradient(100deg,transparent 0 40%,rgba(255,255,255,.28) 50%,transparent 60%) 0 0/300% 100% no-repeat;animation:sheen 3.2s ease-in-out infinite;mix-blend-mode:screen}
@keyframes sheen{0%{background-position:140% 0}37%,100%{background-position:-40% 0}}
.hx-tube.ready > img:first-child{animation:readybreathe 2s ease-in-out infinite}
@keyframes readybreathe{50%{filter:brightness(1.12)}}
.hx-status{margin:0;z-index:7;display:grid;place-items:center;text-align:center;font-size:calc(15.5*var(--u));line-height:calc(19.5*var(--u));color:#f4da9a;text-shadow:0 0 calc(2*var(--u)) rgba(244,200,100,.35),0 calc(.6*var(--u)) calc(.8*var(--u)) rgba(0,0,0,.6);text-wrap:balance;padding:0 calc(6*var(--u))}
.hx-status b{color:#ffe3a0;font-weight:700}
.hx-card{background:url(art/nest/info_card_panel.webp) center/100% 100% no-repeat;z-index:7}
.hx-portrait{z-index:8}
.hx-portrait > img{position:absolute;inset:0;width:100%;height:100%}
.hx-portrait .pe{inset:auto;left:-2.5%;top:-11.4%;width:105%;height:105%}
.hx-portrait.ready .pe{animation:eggwobble 3.1s ease-in-out infinite;transform-origin:50% 90%}
.hx-cardtext{z-index:8;display:flex;flex-direction:column;justify-content:center;gap:calc(3*var(--u))}

<script>
(function(){
"use strict";

/* ================= data ================= */
/* Each egg hatches one dragon line. Every line has four stages, each a looping painting. */
const DRAGONS = {
  cinder:{name:"Cinder"}, brine:{name:"Brine"}, moss:{name:"Moss"}, inferno:{name:"Inferno"},
  stormling:{name:"Stormling"}, voidling:{name:"Voidling"}, tempest:{name:"Tempest"}
};
/* Average color of each video's outer edge, measured when the videos were encoded. */
const EDGES = {"brine-1":"#a89d8d","brine-2":"#aa9e8f","brine-3":"#a5998a","brine-4":"#a49687","cinder-1":"#d6c2a5","cinder-2":"#ddc4a5","cinder-3":"#d6b593","cinder-4":"#d4b08d","inferno-1":"#c9b597","inferno-2":"#ccb698","inferno-3":"#c2a98b","inferno-4":"#c2a583","moss-1":"#e5d2b3","moss-2":"#ebd8b9","moss-3":"#e5d2b3","moss-4":"#e6d2b1","stormling-1":"#b19a80","stormling-2":"#ac967f","stormling-3":"#af9981","stormling-4":"#af9880","tempest-1":"#b29c83","tempest-2":"#a19081","tempest-3":"#c4af99","tempest-4":"#b7a491","voidling-1":"#b19a80","voidling-2":"#b0987d","voidling-3":"#b6a089","voidling-4":"#b5a08b"};
const ITEMS = [
  {id:"ember", scene:0, kind:"egg", rarity:"Common", line:"cinder", name:"Ember Egg", price:4000, hatch:6000,
   hint:"Warm in the hand. Whatever is inside sulks already.",},
  {id:"tide", scene:0, kind:"egg", rarity:"Common", line:"brine", name:"Tide Egg", price:6000, hatch:8000,
   hint:"Smells like rain on stone. It sloshes faintly when you carry it.",},
  {id:"forest", scene:0, kind:"egg", rarity:"Uncommon", line:"moss", name:"Grove Egg", price:12000, hatch:15000,
   hint:"Mossy, warm, and faintly rude. The seller won\u2019t say what\u2019s inside.",},
  {id:"trail", scene:0, kind:"trail", fx:"lantern", name:"Paper Lantern Trail", price:2500,
   hint:"Tiny paper lanterns drift up beside your dragon. The seller swears he doesn’t light them."},
  {id:"inferno", scene:1, kind:"egg", rarity:"Rare", line:"inferno", name:"Forge Egg", price:40000, hatch:35000,
   hint:"Fired in the kiln itself. Too hot to hold for long.",},
  {id:"storm", scene:1, kind:"egg", rarity:"Rare", line:"stormling", name:"Squall Egg", price:30000, hatch:30000,
   hint:"Hums before thunder. The Kilnwright keeps it away from his tools.",},
  {id:"tsparks", scene:1, kind:"trail", fx:"sparks", name:"Ember Sparks", price:15000,
   hint:"Sparks swept off the Kilnwright’s anvil. Harmless, mostly."},
  {id:"void", scene:2, kind:"egg", rarity:"Epic", line:"voidling", name:"Night Egg", price:90000, hatch:60000,
   hint:"Cold, heavy, and darker than it should be. The stranger won\u2019t touch it bare-handed.",},
  {id:"tempest", scene:2, kind:"egg", rarity:"Legendary", line:"tempest", name:"Storm Egg", price:200000, hatch:120000,
   hint:"Rain beads on it indoors. Nobody has seen what comes out of one in years.",},
  {id:"tmoths", scene:2, kind:"trail", fx:"moths", name:"Night Moths", price:35000,
   hint:"Pale moths that follow it everywhere. They think it’s the moon."},
  {id:"twisps", scene:2, kind:"trail", fx:"wisps", name:"Storm Wisps", price:50000,
   hint:"Curls of cold blue weather that never quite become lightning."}
];
/* Mutation odds by rarity: any hatch can roll one, independent of species. */
const RARITY = {Common:{mut:.03}, Uncommon:{mut:.05}, Rare:{mut:.08}, Epic:{mut:.12}, Legendary:{mut:.2}};
const MUTATIONS = {
  moonlit:  {name:"Moonlit",  fx:"moon"},
  obsidian: {name:"Obsidian", fx:"gold"},
  gilded:   {name:"Gilded",   fx:"shine"},
  aurora:   {name:"Aurora",   fx:"aurora"}
};
/* Only the prize dragon grows, from steps added while it holds the slot. */
/* Tuned to roughly 7,500 real steps a day: Juvenile in about 4 days, Adult in about 2 weeks, Elder in about 2 months. */
const STAGES = [{name:"Hatchling", at:0}, {name:"Juvenile", at:30000}, {name:"Adult", at:120000}, {name:"Elder", at:400000}];
const ITEM = Object.fromEntries(ITEMS.map(i => [i.id, i]));
/* Each vendor has a specialty. A scene opens once you own its keys from the vendor before it, and stays open. */
const SCENES = [
  {name:"Lantern Stall", keeper:"The egg seller \u00B7 common eggs and lanterns", quip:"\u201CPaid in steps. Prices are firm.\u201D", art:artStallVideo, pos:"50% 62%", keys:[]},
  {name:"Moon Kiln", keeper:"The Kilnwright \u00B7 kiln-fired eggs and sparks", quip:"\u201CFired at moonrise. Priced accordingly.\u201D", art:artKilnVideo, pos:"50% 42%", keys:["ember","tide"]},
  {name:"Cliff Roost", keeper:"A stranger \u00B7 storm eggs and night trails", quip:"Sells what the storm leaves behind. Doesn\u2019t haggle.", art:artRoostVideo, pos:"50% 30%", keys:["storm","tsparks"]}
];
const KEY = "scalebank.v1";

/* ================= state ================= */
function fresh(){ return {bank:0, lifetime:0, owned:{}, bought:{}, opened:{}, eggs:[], dragons:[], prize:null, scene:0, tab:"bank", seq:1}; }
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) return Object.assign(fresh(), JSON.parse(raw)); } catch(e){}
  return null;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
let S = fresh();

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const fmt = n => Math.round(n).toLocaleString("en-US");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const itemsIn = s => ITEMS.filter(i => i.scene === s);
let uid = 0;
function sceneOpen(s){
  if (s === 0 || S.opened[s]) return true;
  const ok = sceneOpen(s-1) && SCENES[s].keys.every(k => S.owned[k]);
  if (ok) S.opened[s] = true;
  return ok;
}
function eggProgress(e){ return Math.min(ITEM[e.item].hatch, S.lifetime - e.at); }
function eggReady(e){ return eggProgress(e) >= ITEM[e.item].hatch; }
function prizeDragon(){ return S.dragons.find(d => d.id === S.prize) || null; }
function stageIdx(d){ let i = 0; STAGES.forEach((st, k) => { if ((d.xp || 0) >= st.at) i = k; }); return i; }
function rarityOf(d){ return ITEM[d.item].rarity; }
const rcls = r => "r-" + r.toLowerCase();
const pct = p => { const v = p * 100; return (v < 1 ? v.toFixed(1) : Math.round(v)) + "%"; };
function oddsOf(it){
  const m = RARITY[it.rarity].mut;
  return [{name:"Mystery dragon", p:1 - m}, {name:"Mutation", p:m, mut:true}];
}
const an = w => (/^[AEIOU]/i.test(w) ? "an " : "a ") + w;
const cap = w => w.charAt(0).toUpperCase() + w.slice(1);
function listJoin(a){ return a.length < 2 ? a.join("") : a.slice(0,-1).join(", ") + " and " + a[a.length-1]; }
function kindLabel(it){
  if (it.kind === "egg") return it.rarity + " egg \u00B7 cracks after " + fmt(it.hatch) + " steps";
  return "Trail";
}

let toastT;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 3200);
}

/* ================= art: helpers ================= */
function hex2rgb(h){ h = h.replace("#",""); return [0,2,4].map(i => parseInt(h.substr(i,2),16)); }
function mix(a, b, t){ const A = hex2rgb(a), B = hex2rgb(b); return "#" + A.map((v,i) => Math.round(v + (B[i]-v)*t).toString(16).padStart(2,"0")).join(""); }
const lt = (c,t) => mix(c, "#fff3dc", t), dk = (c,t) => mix(c, "#0b0612", t);
const GOLD_STOPS = `<stop offset="0" stop-color="#6e4610"/><stop offset=".22" stop-color="#e9c46c"/><stop offset=".4" stop-color="#fff0bd"/><stop offset=".58" stop-color="#c8902e"/><stop offset=".8" stop-color="#f2d07c"/><stop offset="1" stop-color="#6e4610"/>`;

function trailSVG(type, id, vb){
  const at = (pts, f) => pts.map((p, i) => `<g class="tl" style="animation-delay:${(-i * 4.6 / pts.length).toFixed(2)}s"><g transform="translate(${p[0]} ${p[1]}) scale(${p[2] || 1})">${f(i)}</g></g>`).join("");
  let defs = "", body = "";
  if (type === "sparks"){
    defs = `<radialGradient id="${id}s"><stop offset="0" stop-color="#fff2c0"/><stop offset=".25" stop-color="#ffb050"/><stop offset=".6" stop-color="#ff6a2a" stop-opacity=".35"/><stop offset="1" stop-color="#ff6a2a" stop-opacity="0"/></radialGradient>`;
    body = at([[700,1000,1.2],[735,880,.8],[680,790,1],[752,700,.7],[700,600,1.1],[742,480,.8],[690,380,.9],[735,280,.7],[668,190,.8],[610,1080,.9],[640,900,.6],[720,1080,.7]],
      () => `<circle r="34" fill="url(#${id}s)"/><circle r="5" fill="#fff6d8"/>`);
  } else if (type === "moths"){
    body = at([[700,960,1.3],[742,760,1.1],[686,560,1.2],[744,380,1],[676,210,.9],[590,1070,1]],
      () => `<circle r="44" fill="#f4ecd4" opacity=".14"/>
        <g class="mw"><path d="M0 0 C-30 -34 -52 -18 -46 2 C-40 18 -16 12 0 0 Z M0 0 C30 -34 52 -18 46 2 C40 18 16 12 0 0 Z" fill="#efe6cf" stroke="#9a8c70" stroke-width="2"/>
        <path d="M0 2 C-22 10 -30 30 -16 34 C-6 36 -2 18 0 2 Z M0 2 C22 10 30 30 16 34 C6 36 2 18 0 2 Z" fill="#e2d6b8" stroke="#9a8c70" stroke-width="2"/>
        <circle cx="-28" cy="-8" r="6" fill="#b8a888" opacity=".7"/><circle cx="28" cy="-8" r="6" fill="#b8a888" opacity=".7"/></g>
        <ellipse rx="5" ry="18" cy="6" fill="#6a5c48"/>`);
  } else if (type === "wisps"){
    defs = `<filter id="${id}b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>`;
    const curl = `M-40 30 C-30 -20 30 -6 14 -46 C4 -70 36 -92 52 -70`;
    body = at([[700,980,1.6],[744,770,1.3],[690,570,1.4],[742,380,1.1],[676,200,1],[600,1070,1.2]],
      () => `<path d="${curl}" stroke="#8fc4ff" stroke-width="22" fill="none" stroke-linecap="round" opacity=".45" filter="url(#${id}b)"/>
        <path d="${curl}" stroke="#e6f3ff" stroke-width="6" fill="none" stroke-linecap="round"/>
        <path d="M14 -46 l10 10 l-8 2 l10 12" stroke="#ffffff" stroke-width="3" fill="none" stroke-linejoin="round" opacity=".8"/>`);
  } else {
    defs = `<radialGradient id="${id}l" cx=".42" cy=".38" r=".66"><stop offset="0" stop-color="#fff2c4"/><stop offset=".35" stop-color="#ffa055"/><stop offset=".75" stop-color="#d63c26"/><stop offset="1" stop-color="#6e160e"/></radialGradient>
      <radialGradient id="${id}g"><stop offset="0" stop-color="#ffab62" stop-opacity=".6"/><stop offset="1" stop-color="#ff8a45" stop-opacity="0"/></radialGradient>`;
    body = at([[700,980,1.7],[745,760,1.45],[690,560,1.3],[742,380,1.15],[680,200,1],[560,1070,1.3]],
      () => `<circle r="70" fill="url(#${id}g)"/>
        <path d="M-15 -22 h30 l-3 8 h-24 z" fill="#d8a94b"/>
        <path d="M-14 -15 C-38 -10 -38 10 -14 15 H14 C38 10 38 -10 14 -15 Z" fill="url(#${id}l)"/>
        <path d="M-6 -15 C-17 -6 -17 6 -6 15 M6 -15 C17 -6 17 6 6 15 M0 -15 V15" stroke="#6e160e" stroke-width="1.4" fill="none" opacity=".5"/>
        <path d="M-14 15 h28 l-3 7 h-22 z" fill="#d8a94b"/><path d="M0 22 v14" stroke="#d8a94b" stroke-width="2"/>`);
  }
  return `<svg class="trail" viewBox="${vb || "0 0 768 1152"}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>${defs}</defs>${body}</svg>`;
}
function stageSrc(line, si){ return `art/dragons/${line}-${si + 1}`; }
/* o.live plays the loop (prize card, hatch, share card); everywhere else shows the poster frame. */
function dragonArt(d, o){
  o = o || {};
  const si = o.stage != null ? o.stage : stageIdx(d), src = stageSrc(d.line, si);
  const live = o.live && !matchMedia("(prefers-reduced-motion: reduce)").matches;
  const fx = !o.ghost && d.mut ? MUTATIONS[d.mut].fx : "";
  const trail = !o.ghost && d.trail && ITEM[d.trail] ? trailSVG(ITEM[d.trail].fx || "lantern", "t" + (uid++)) : "";
  const label = o.ghost ? "Empty prize slot" : esc(`${d.name || DRAGONS[d.line].name}, ${STAGES[si].name.toLowerCase()}`);
  const media = live
    ? `<video poster="${src}.webp" autoplay muted loop playsinline preload="auto" aria-hidden="true"><source src="${src}.webm" type="video/webm"><source src="${src}.mp4" type="video/mp4"></video>`
    : o.ghost ? "" : `<img src="${src}.webp" alt="" loading="lazy" draggable="false">`;
  return `<div class="dart${live || trail ? " anim" : ""}${fx ? " fx-" + fx : ""}${o.ghost ? " ghost" : ""}${o.grow ? " grow-in" : ""}" style="--edge:${EDGES[d.line + "-" + (si + 1)] || "#d8c8ac"}" role="img" aria-label="${label}">${media}${trail}${fx === "shine" ? `<b class="shine"></b>` : ""}</div>`;
}

/* ================= screens ================= */
function setTab(t){
  S.tab = t;
  for (const id of ["bank","vendors","nest","dragon"]) document.getElementById(id).hidden = id !== t;
  document.querySelectorAll(".tab").forEach(b => { if (b.dataset.tab === t) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  if (t === "vendors") requestAnimationFrame(() => scrollToScene(S.scene, false));
  syncVideos();
  render(); save();
}

/* --- bank --- */
let shown = 0, raf;
function countTo(n){
  cancelAnimationFrame(raf);
  const from = shown, t0 = performance.now(), dur = Math.min(900, 300 + Math.abs(n-from)/4);
  const el = $("#balance");
  const step = now => {
    const k = Math.min(1, (now - t0)/dur), e = 1 - Math.pow(1-k, 3);
    shown = from + (n - from)*e; el.textContent = fmt(shown);
    if (k < 1) raf = requestAnimationFrame(step); else shown = n;
  };
  if (matchMedia("(prefers-reduced-motion: reduce)").matches){ shown = n; el.textContent = fmt(n); return; }
  raf = requestAnimationFrame(step);
}
function affordScene(){
  if (sceneOpen(S.scene)) return S.scene;
  let s = 0; while (s + 1 < SCENES.length && sceneOpen(s + 1)) s++;
  return s;
}
function affordLine(){
  const s = affordScene(), sc = SCENES[s], stock = itemsIn(s);
  if (!stock.length) return `The ${sc.name} has nothing for sale yet.`;
  const left = stock.filter(i => i.kind === "egg" || !S.owned[i.id]).sort((a,b) => a.price - b.price);
  const can = left.filter(i => i.price <= S.bank);
  if (!can.length) return `${fmt(left[0].price - S.bank)} steps short of ${left[0].name}, the cheapest thing at the ${sc.name}.`;
  if (can.length === left.length) return `Enough for anything at the ${sc.name}.`;
  if (can.length <= 2) return `Enough for ${listJoin(can.map(i => i.name))} at the ${sc.name}.`;
  return `Enough for ${can.length} things at the ${sc.name}, up to ${can[can.length-1].name}.`;
}
function renderBank(){
  countTo(S.bank);
  $("#afford").textContent = affordLine();
  $("#lifetime").innerHTML = `<b>${fmt(S.lifetime)}</b> lifetime steps earned`;
}

/* --- vendors --- */
let pending = null, pendingT;
const KINDS = [["egg","Eggs"],["trail","Trails"]];
const VF = SCENES.map(() => "all");
const CHEV = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
function buildScenes(){
  const box = $("#scenes"), last = SCENES.length - 1;
  box.innerHTML = SCENES.map((sc, i) => `<section class="scene" id="scene-${i}" data-scene="${i}" role="tabpanel" aria-label="${esc(sc.name)}">
      <div class="art" style="--pos:${sc.pos}">${sc.art()}<i class="shade"></i>
        <div class="vtitle"><div class="eyebrow">${esc(sc.keeper)}</div><h2>${esc(sc.name)}</h2><p class="quip">${sc.quip}</p></div>
        <div class="lockbadge" hidden>${LOCK} Locked</div>
        ${i > 0 ? `<button class="vnav prev" data-act="dot" data-i="${i-1}" aria-label="Previous vendor: ${esc(SCENES[i-1].name)}">${CHEV("M15 5l-7 7 7 7")}</button>` : ""}
        ${i < last ? `<button class="vnav next" data-act="dot" data-i="${i+1}" aria-label="Next vendor: ${esc(SCENES[i+1].name)}">${CHEV("M9 5l7 7-7 7")}</button>` : ""}
      </div>
      <div class="vtools"><div class="fchips" role="group" aria-label="Filter ${esc(sc.name)}"></div><span class="chip vchip"></span></div>
      <div class="sbody"></div>
    </section>`).join("");
  $("#vrail").innerHTML = SCENES.map((sc, i) => `<button class="vtab" role="tab" id="vtab-${i}" aria-controls="scene-${i}" data-act="dot" data-i="${i}"><b>${esc(sc.name)}</b><small></small></button>`).join("") + `<i class="vind" aria-hidden="true"></i>`;
  let t, f = 0;
  box.addEventListener("scroll", () => {
    if (!f) f = requestAnimationFrame(() => { f = 0; $("#vrail").style.setProperty("--p", (box.scrollLeft / Math.max(1, box.clientWidth)).toFixed(4)); });
    clearTimeout(t);
    t = setTimeout(() => {
      const i = Math.round(box.scrollLeft / box.clientWidth);
      if (i !== S.scene){ S.scene = i; renderRail(); syncVideos(); save(); }
    }, 80);
  }, {passive:true});
}
function syncVideos(){
  const on = S.tab === "vendors" && !matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.querySelectorAll(".scene").forEach(el => {
    const v = el.querySelector(".scene-vid"); if (!v) return;
    if (on && +el.dataset.scene === S.scene) v.play().catch(() => {}); else v.pause();
  });
}
function scrollToScene(i, smooth){
  i = Math.max(0, Math.min(SCENES.length - 1, i));
  const box = $("#scenes");
  box.scrollTo({left: i * box.clientWidth, behavior: smooth && !matchMedia("(prefers-reduced-motion: reduce)").matches ? "smooth" : "auto"});
  if (!smooth) $("#vrail").style.setProperty("--p", i);
  S.scene = i; renderRail(); syncVideos();
}
function renderRail(){
  document.querySelectorAll("#vrail .vtab").forEach((b, i) => {
    const open = sceneOpen(i);
    b.setAttribute("aria-selected", i === S.scene ? "true" : "false");
    b.tabIndex = i === S.scene ? 0 : -1;
    b.classList.toggle("locked", !open);
    b.querySelector("small").innerHTML = open ? `${itemsIn(i).length} items` : `${LOCK} Locked`;
  });
}
function itemRow(it, teaser){
  const isEgg = it.kind === "egg";
  const owned = !isEgg && !!S.owned[it.id];
  const bought = isEgg ? (S.bought[it.id] || (S.owned[it.id] ? 1 : 0)) : 0;
  const thumb = isEgg ? eggImg(it, "shopegg")
    : `<div class="dart anim tthumb">${trailSVG(it.fx || "lantern", "q" + (uid++), "590 500 200 240")}</div>`;
  let action;
  if (owned){
    const where = it.kind === "egg" ? (S.eggs.some(e => e.item === it.id) ? "Owned · in your nest" : "Owned · hatched") : "Owned · in your customizer";
    action = `<span class="owned-tag">✓ ${where}</span>`;
  } else if (teaser){
    action = `<button class="btn buy" disabled tabindex="-1">${fmt(it.price)} steps<small>Locked</small></button>`;
  } else if (pending === it.id){
    action = `<button class="btn buy confirm" data-act="buy" data-id="${it.id}">Confirm ${fmt(it.price)}<small>Tap again to buy</small></button>`;
  } else if (S.bank >= it.price){
    action = `<button class="btn buy" data-act="buy" data-id="${it.id}">${fmt(it.price)} steps<small>Buy</small></button>`;
  } else {
    action = `<button class="btn buy" disabled>${fmt(it.price)} steps<small>Need ${fmt(it.price - S.bank)} more</small></button>`;
  }
  return `<div class="item${owned ? " owned" : ""}">
      <div class="thumb">${thumb}</div>
      <div><div class="kind${isEgg ? " " + rcls(it.rarity) : ""}">${kindLabel(it)}</div>
        <div class="iname">${esc(it.name)}</div>
        <p class="hint">${esc(it.hint)}</p>
        ${isEgg ? `<div class="odds" aria-label="Hatch odds">${oddsOf(it).map(x => `<span${x.mut ? ` class="mut"` : ""}>${esc(x.name)} <b>${pct(x.p)}</b></span>`).join("")}</div>` : ""}
        <div class="buyrow">${action}${bought ? `<span class="bought">Bought ${bought}</span>` : ""}</div></div>
    </div>`;
}
function stockHTML(i, teaser){
  const stock = itemsIn(i), f = VF[i];
  const groups = KINDS.filter(([k]) => stock.some(x => x.kind === k));
  const rows = list => `<div class="list${teaser ? " teaser" : ""}"${teaser ? ` aria-hidden="true"` : ""}>${list.map(x => itemRow(x, teaser)).join("")}</div>`;
  if (f !== "all") return rows(stock.filter(x => x.kind === f));
  return groups.map(([k, label]) => {
    const g = stock.filter(x => x.kind === k);
    return `<h3 class="ghead">${label} <span>${g.length}</span></h3>${rows(g)}`;
  }).join("");
}
function renderVendors(){
  document.querySelectorAll(".vchip").forEach(c => { c.innerHTML = `<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="2.6"/><path d="M5 6v6c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6V6M5 12v6c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6v-6"/></svg>${fmt(S.bank)}`; c.setAttribute("aria-label", `Balance: ${fmt(S.bank)} steps`); });
  renderRail();
  document.querySelectorAll(".scene").forEach(el => {
    const i = +el.dataset.scene, open = sceneOpen(i), stock = itemsIn(i);
    el.classList.toggle("is-locked", !open);
    el.querySelector(".lockbadge").hidden = open;
    const kinds = KINDS.filter(([k]) => stock.some(x => x.kind === k));
    if (VF[i] !== "all" && !kinds.some(([k]) => k === VF[i])) VF[i] = "all";
    const chip = (k, label, n) => `<button class="fchip" data-act="vf" data-i="${i}" data-k="${k}" aria-pressed="${VF[i] === k}" aria-label="${label}, ${n}">${label}</button>`;
    el.querySelector(".fchips").innerHTML = chip("all", "All", stock.length) + kinds.map(([k, label]) => chip(k, label, stock.filter(x => x.kind === k).length)).join("");
    let h = "";
    if (!open){
      const prev = SCENES[i-1], keys = SCENES[i].keys.map(k => ITEM[k]), miss = keys.filter(x => !S.owned[x.id]);
      const total = miss.reduce((a, x) => a + x.price, 0);
      h += `<div class="lockcard"><p>Opens once you own ${listJoin(keys.map(x => x.name))} from the ${esc(prev.name)}.${miss.length ? " Still missing:" : ""}</p>
        <ul class="missing">${miss.map(x => `<li><span>${esc(x.name)}</span><span>${fmt(x.price)} steps</span></li>`).join("")}</ul>
        ${miss.length > 1 ? `<p style="margin:10px 0 0;font-size:13px;color:var(--muted)">${fmt(total)} steps in all.</p>` : ""}
        ${!sceneOpen(i-1) ? `<p style="margin:10px 0 0;font-size:13px;color:var(--muted)">Open the ${esc(prev.name)} first.</p>` : `<button class="btn ghost" data-act="dot" data-i="${i-1}">Go to the ${esc(prev.name)}</button>`}</div>`;
      h += stockHTML(i, true);
    } else {
      h += stockHTML(i, false);
    }
    el.querySelector(".sbody").innerHTML = h;
  });
}

/* --- nest --- */
/* Built from the Nest asset pack (SPEC.md). Everything is laid out in the spec's points on a
   390 pt wide stage and scaled to the screen with --u (1 pt). Rows grow past three as eggs
   are added. Nothing here shows or names the dragon inside before it hatches. */
const NA = "art/nest/";
const eggImg = (it, cls) => `<img class="${cls || "eggimg"}" src="${NA}${it.line}_egg.webp" alt="" draggable="false">`;
const COLS = [93, 195, 297], ROW0 = 239, PITCH = 145, MIN_ROWS = 3;
/* The gold ring shows around any egg within this many steps of hatching. */
const RING_STEPS = 2000;
let NSEL = null;
const stepsLeft = e => Math.max(0, ITEM[e.item].hatch - eggProgress(e));
const pctOf = e => Math.min(1, eggProgress(e) / ITEM[e.item].hatch);
function nestOrder(){ return S.eggs.slice().sort((a, b) => pctOf(b) - pctOf(a) || stepsLeft(a) - stepsLeft(b)); }
const P = (x, y, w, h) => `left:calc(${x}*var(--u));top:calc(${y}*var(--u));width:calc(${w}*var(--u));height:calc(${h}*var(--u))`;
function ringHTML(x, y){
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  return `<div class="hx-ring" style="${P(x, y, 150, 150)}" aria-hidden="true">${still
    ? `<img src="${NA}ring.webp" alt="">`
    : `<div class="rs"></div>`}</div>`;
}
function tubeHTML(e, x, y){
  if (!e) return `<div class="hx-tube" style="${P(x, y, 96, 28)}" aria-hidden="true"><img src="${NA}tube_track_back.webp" alt=""><img src="${NA}tube_track_front.webp" alt=""></div>`;
  const p = pctOf(e), rd = p >= 1;
  if (rd) return `<div class="hx-tube ready" style="${P(x, y, 96, 28)}" aria-hidden="true"><img src="${NA}tube_ready_full.webp" alt=""><img src="${NA}tube_ready_label.webp" alt=""></div>`;
  const right = p > 0 ? Math.max(7.4 + 4, 7.4 + 81.2 * p) : 0;
  const clip = `clip-path:inset(0 ${(100 - right / 96 * 100).toFixed(2)}% 0 0 round 0 calc(7.6*var(--u)) calc(7.6*var(--u)) 0)`;
  return `<div class="hx-tube" style="${P(x, y, 96, 28)}" aria-hidden="true">
      <img src="${NA}tube_track_back.webp" alt="">
      ${p > 0 ? `<img src="${NA}fill_${ITEM[e.item].line}.webp" alt="" style="${clip}"><i class="sheen" style="${clip};animation-delay:${(-(e.at % 3200) / 1000).toFixed(2)}s"></i>` : ""}
      <img src="${NA}tube_track_front.webp" alt=""></div>`;
}
function renderNest(){
  const eggs = nestOrder();
  if (!eggs.some(e => e.id === NSEL)) NSEL = eggs.length ? eggs[0].id : null;
  const ready = eggs.filter(eggReady).length;
  const rows = Math.max(MIN_ROWS, Math.ceil(eggs.length / 3)), D = (rows - MIN_ROWS) * PITCH;
  let rings = "", body = "";
  for (let r = 0; r < rows; r++){
    const ty = ROW0 + r * PITCH;
    body += `<img class="hx-shelf" src="${NA}shelf.webp" alt="" style="${P(29, ty - 6, 332, 46)}">`;
    COLS.forEach((cx, c) => {
      const e = eggs[r * 3 + c], sx = cx - 50, sy = ty - 92;
      if (e && stepsLeft(e) <= RING_STEPS) rings += ringHTML(sx - 25, sy - 50);
      if (!e){ body += `<img class="hx-slot empty" src="${NA}nest_empty.webp" alt="" style="${P(sx, sy, 100, 100)}">`; return; }
      const it = ITEM[e.item], rd = eggReady(e);
      body += `<button class="hx-slot${rd ? " ready" : ""}${e.id === NSEL ? " sel" : ""}" data-act="nsel" data-id="${e.id}" style="${P(sx, sy, 100, 100)};--p:${pctOf(e).toFixed(3)};animation-delay:${(-(e.at % 3100) / 1000).toFixed(2)}s"
          aria-label="${esc(it.name)}, ${rd ? "ready to crack" : Math.floor(pctOf(e) * 100) + "% warm, " + fmt(stepsLeft(e)) + " steps to go"}" aria-pressed="${e.id === NSEL}">
          <i class="glow"></i><img src="${NA}${it.line}_nest.webp" alt="" draggable="false"></button>`;
    });
    body += `<img class="hx-conn" src="${NA}tube_connector.webp" alt="" style="${P(COLS[0] + 42, ty - 4, 18, 28)}"><img class="hx-conn" src="${NA}tube_connector.webp" alt="" style="${P(COLS[1] + 42, ty - 4, 18, 28)}">`;
    COLS.forEach((cx, c) => { body += tubeHTML(eggs[r * 3 + c], cx - 48, ty - 4); });
  }
  const sel = eggs.find(x => x.id === NSEL);
  let banner, status, card;
  if (!sel){
    banner = "Your nest is empty. Eggs you buy warm up here as you walk.";
    status = "No eggs warming yet.";
    card = `<div class="hx-portrait" style="${P(37.5, 639 + D, 112, 112)}"><img src="${NA}portrait_backing.webp" alt=""><img class="pe" src="${NA}nest_empty.webp" alt=""><img src="${NA}portrait_frame.webp" alt=""></div>
      <div class="hx-cardtext" style="${P(164.5, 646 + D, 190, 104)}"><div class="caps">Nest · empty</div><div class="title">No eggs yet</div>
        <button class="hx-btn" data-act="goto-stall">Visit the stall</button></div>`;
  } else {
    const it = ITEM[sel.item], p = pctOf(sel), rd = p >= 1;
    banner = rd ? `${esc(it.name)} is ready to crack! Tap Crack it below to hatch it.` : `${esc(it.name)} is in your nest. It cracks after ${fmt(stepsLeft(sel))} more steps.`;
    status = `${eggs.length} egg${eggs.length > 1 ? "s" : ""} warming${ready ? ` · <b>${ready} ready to crack</b>` : ""}. Every step you walk warms all of them at once.`;
    const flavor = p < .34 ? "It’s still and quiet." : p < .67 ? "It’s warm to the touch." : "Something is pressing at the shell from the inside.";
    card = `<div class="hx-portrait${rd ? " ready" : ""}" style="${P(37.5, 639 + D, 112, 112)}"><img src="${NA}portrait_backing.webp" alt="">${eggImg(it, "pe")}<img src="${NA}portrait_frame.webp" alt=""></div>
      <div class="hx-cardtext" style="${P(164.5, 646 + D, 190, 104)}">
        <div class="caps">${it.rarity} egg · ${rd ? "ready" : "warming"}</div>
        <div class="title">${esc(it.name)}</div>
        ${rd ? `<button class="hx-btn" data-act="hatch" data-id="${sel.id}">Crack it</button>` : `<p class="body">${flavor}</p>`}
      </div>`;
  }
  const embers = Array.from({length:12}, (_, i) => {
    const left = i % 2 ? 2 + (i * 7) % 26 : 362 + (i * 5) % 26;
    return `<img class="ember" src="${NA}ember_0${(i % 6) + 1}.webp" alt="" style="left:calc(${left}*var(--u));top:calc(${300 + (i * 97) % 420 + D}*var(--u));animation-duration:${(4 + (i * 13) % 4)}s;animation-delay:${(-i * 0.9).toFixed(1)}s">`;
  }).join("");
  $("#nestBody").innerHTML = `<div class="hx"><div class="hx-in" style="height:calc(${776 + D}*var(--u))">
      <div class="embers" aria-hidden="true">${embers}</div>
      <div class="hx-banner" style="${P(21, 24, 348, 78)}"><p>${banner}</p></div>
      <div class="hx-cab-back" style="${P(20, 90, 350, 488 + D)}"></div>
      ${rings}${body}
      <div class="hx-cab-frame" style="${P(20, 90, 350, 488 + D)}"></div>
      <p class="hx-status" style="${P(14, 574 + D, 362, 54)}"><span>${status}</span></p>
      <div class="hx-card" style="${P(18, 628 + D, 354, 136)}"></div>
      ${card}
    </div></div>`;
}

/* --- dragon --- */
function renderDragon(){
  $("#dchip").innerHTML = `${fmt(S.bank)} <small>steps</small>`;
  const p = prizeDragon();
  let h = "";
  if (p){
    const ownedOf = k => ITEMS.filter(i => i.kind === k && S.owned[i.id]);
    const opt = (k, val, label, sw) => `<button class="opt" data-act="equip" data-k="${k}" data-v="${val || ""}" aria-pressed="${(p[k] || "") === (val || "")}">${sw ? `<i class="sw" style="background:${sw}"></i>` : ""}${esc(label)}</button>`;
    const row = (k, title, noneMsg) => {
      const list = ownedOf(k);
      return `<div class="crow"><span class="lbl">${title}</span>${list.length
        ? `<div class="opts">${opt(k, null, "None")}${list.map(i => opt(k, i.id, i.name)).join("")}</div>`
        : `<p class="none-note">${noneMsg}</p>`}</div>`;
    };
    const si = stageIdx(p), st = STAGES[si], nx = STAGES[si + 1], xp = p.xp || 0;
    const grew = p.seenStage != null && p.seenStage < si;
    p.seenStage = si; save();
    const growth = nx
      ? `<div class="bar"><i style="width:${((xp - st.at) / (nx.at - st.at) * 100).toFixed(1)}%"></i></div>
         <div class="prog">${fmt(xp - st.at)} of ${fmt(nx.at - st.at)} steps to ${nx.name}</div>`
      : `<div class="prog">Fully grown. ${fmt(xp)} steps walked as your prize.</div>`;
    h += `<div class="frame"><span class="plaque">Prize dragon</span>
        <div class="stage">${dragonArt(p, {live:true, grow:grew})}</div>
        ${grew ? `<div class="grew-note">Grew into ${an(st.name)}</div>` : ""}
        <p class="pname" id="pname">${esc(p.name)}</p>
        <div class="species">${esc(p.species)} \u00B7 <span class="r ${rcls(rarityOf(p))}">${rarityOf(p)}</span>, from ${an(esc(ITEM[p.item].name))}</div>
        ${p.mut ? `<div class="mutb">${MUTATIONS[p.mut].name} mutation</div>` : ""}
        <div class="growth"><div class="growth-head"><span class="stage-pill">${st.name}</span><span class="growth-note">Steps you add while it\u2019s your prize grow it</span></div>${growth}</div>
      </div>
      <button class="btn share-btn" data-act="share">Make share card</button>
      <div class="section"><h2>Customize</h2>
        <div class="custom">
          <div class="crow"><label for="dname">Name</label><input id="dname" maxlength="16" autocomplete="off" value="${esc(p.name)}"></div>
          ${row("trail", "Trail", `No trail owned. The Paper Lantern Trail is ${fmt(ITEM.trail.price)} steps at the Lantern Stall.`)}
        </div></div>`;
  } else {
    const next = S.eggs.slice().sort((a,b) => (ITEM[a.item].hatch - eggProgress(a)) - (ITEM[b.item].hatch - eggProgress(b)))[0];
    let msg;
    if (next && eggReady(next)) msg = `Your ${esc(ITEM[next.item].name)} is ready. Crack it in the nest and claim this slot.`;
    else if (next) msg = `Your ${esc(ITEM[next.item].name)} cracks in ${fmt(ITEM[next.item].hatch - eggProgress(next))} steps. Whatever hatches sits here.`;
    else msg = `Buy an egg at the Lantern Stall. Whatever hatches sits here.`;
    h += `<div class="frame empty"><span class="plaque">Prize slot</span>
        <div class="stage">${dragonArt({line:"cinder"}, {ghost:true, stage:0})}<div class="padlock">${BIGLOCK}</div></div>
        <p class="pname">Unclaimed</p>
        <p>${msg}</p>
        ${next ? `<button class="btn" data-act="goto-nest">Go to the nest</button>` : `<button class="btn" data-act="goto-stall">Visit the Lantern Stall</button>`}
      </div>`;
  }
  if (S.dragons.length > 1){
    const muts = S.dragons.filter(d => d.mut).length;
    h += `<div class="section"><h2>Hoard <small>${S.dragons.length} dragons${muts ? ` \u00B7 ${muts} mutated` : ""}</small></h2>
      <p class="hoard-note">Tap one to put it in the prize slot. Only the prize dragon grows.</p>
      <div class="hoard">${S.dragons.map(d =>
      `<button class="hd ${rcls(rarityOf(d))}${d.mut ? " has-mut" : ""}" data-act="prize" data-id="${d.id}" aria-pressed="${d.id === S.prize}">${dragonArt(d, {still:true})}<span>${esc(d.name)}</span><small>${STAGES[stageIdx(d)].name}${d.mut ? ` \u00B7 ${MUTATIONS[d.mut].name}` : ""}</small><em class="r ${rcls(rarityOf(d))}">${d.id === S.prize ? "Prize" : rarityOf(d)}</em></button>`).join("")}</div></div>`;
  }
  h += `<div style="height:24px"></div>`;
  $("#dragonBody").innerHTML = h;
  const inp = $("#dname");
  if (inp) inp.addEventListener("input", () => {
    const d = prizeDragon(); if (!d) return;
    d.name = inp.value.trim() || d.species;
    $("#pname").textContent = d.name; save();
  });
}

function render(){
  $("#readyDot").hidden = !S.eggs.some(eggReady);
  if (S.tab === "bank") renderBank();
  if (S.tab === "vendors") renderVendors();
  if (S.tab === "nest") renderNest();
  if (S.tab === "dragon") renderDragon();
}

/* ================= actions ================= */
function addSteps(n){
  S.bank += n; S.lifetime += n;
  const msgs = [], p = prizeDragon();
  if (p){
    const was = stageIdx(p); p.xp = (p.xp || 0) + n;
    const now = stageIdx(p);
    if (now > was) msgs.push(`${p.name} grew into ${an(STAGES[now].name)}.`);
  }
  if (msgs.length) toast(msgs.join(" "));
  save(); render(); autoHatch();
}
function buy(id){
  const it = ITEM[id];
  if (!it || (it.kind !== "egg" && S.owned[id]) || S.bank < it.price || !sceneOpen(it.scene)) return;
  if (pending !== id){
    pending = id; clearTimeout(pendingT);
    pendingT = setTimeout(() => { pending = null; render(); }, 3500);
    render(); return;
  }
  pending = null; clearTimeout(pendingT);
  const wasOpen = SCENES.map((_, i) => sceneOpen(i));
  S.bank -= it.price; S.owned[id] = true;
  if (it.kind === "egg") S.bought[id] = (S.bought[id] || 0) + 1;
  if (it.kind === "egg"){
    S.eggs.push({id: "egg" + (S.seq++), item: id, at: S.lifetime});
    toast(`${it.name} is in your nest. It cracks after ${fmt(it.hatch)} more steps.`);
  } else {
    const d = prizeDragon();
    if (d && !d[it.kind]){ d[it.kind] = id; toast(`${it.name} bought and put on ${d.name}.`); }
    else toast(`${it.name} bought. Equip it on the Dragon screen.`);
  }
  const opened = SCENES.findIndex((_, i) => sceneOpen(i) && !wasOpen[i]);
  if (opened > 0) setTimeout(() => toast(`The ${SCENES[opened].name} is open. Tap it above or swipe over.`), 1600);
  save(); render();
}
function rollMutation(it){
  if (Math.random() >= RARITY[it.rarity].mut) return null;
  const keys = Object.keys(MUTATIONS);
  return keys[Math.floor(Math.random() * keys.length)];
}
/* Eggs hatch the moment they're ready, on whatever screen is open. If several come due at once
   they play one after another; "Meet your dragon" waits until the last one. */
const HQ = []; let hatchGo = null;
function autoHatch(){
  S.eggs.filter(eggReady).forEach(e => { if (!HQ.includes(e.id)) HQ.push(e.id); });
  if ($("#hatchOv").hidden && $("#shareOv").hidden) nextHatch();
}
function nextHatch(){
  while (HQ.length){ const id = HQ.shift(); if (S.eggs.some(e => e.id === id)){ hatch(id); return; } }
}
function closeHatch(){
  $("#hatchOv").hidden = true; $("#hatchOv").innerHTML = "";
  if (HQ.length){ render(); setTimeout(nextHatch, 350); return; }
  const go = hatchGo; hatchGo = null;
  if (go) setTab(go); else render();
}
function hatch(eggId){
  const e = S.eggs.find(x => x.id === eggId);
  if (!e || !eggReady(e)) return;
  const it = ITEM[e.item], mut = rollMutation(it), species = DRAGONS[it.line].name;
  const d = {id: "drg" + (S.seq++), item: it.id, line: it.line, species, mut, xp: 0, seenStage: 0, name: species, trail: null};
  S.eggs = S.eggs.filter(x => x !== e);
  S.dragons.push(d);
  const toPrize = !S.prize;
  if (toPrize){ S.prize = d.id; hatchGo = "dragon"; }
  save();
  const more = HQ.filter(id => S.eggs.some(e => e.id === id)).length;
  const ov = $("#hatchOv");
  ov.innerHTML = `<div class="hatch" role="dialog" aria-modal="true" aria-label="Egg hatching">
      <div class="hlead"><span class="eyebrow">You walked it warm</span><h3>Your ${esc(it.name)} is hatching!</h3></div>
      <div class="hstage${mut ? " mutated" : ""}" id="hstage"><div class="flash"></div>
        <div class="born">${dragonArt(d, {live:true})}</div>
        <div class="halves">${eggImg(it, "h-top")}${eggImg(it, "h-bot")}<svg class="crack" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline class="crackline" points="27,57 34,52 42,60 50,52 58,60 66,52 73,57" fill="none" stroke="#fff3cf" stroke-width="1.4" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg></div>
      </div>
      <div class="after" id="hafter">
        ${mut ? `<div class="mutb">Mutation \u00B7 ${pct(RARITY[it.rarity].mut / Object.keys(MUTATIONS).length)} odds</div>` : ""}
        <h3>${cap(an(esc((mut ? MUTATIONS[mut].name + " " : "") + d.species)))} hatched.</h3>
        <div class="r ${rcls(it.rarity)}" style="font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase">${it.rarity} \u00B7 Hatchling</div>
        <p>${toPrize ? "It took the prize slot. Steps you add from now on grow it." : "It joined your hoard. Make it your prize to grow it."}</p>
        <button class="btn" data-act="close-hatch">${more ? `Next egg (${more} more)` : hatchGo ? "Meet your dragon" : "Done"}</button></div>
    </div>`;
  ov.hidden = false;
  const st = $("#hstage");
  requestAnimationFrame(() => st.classList.add("wobble"));
  setTimeout(() => st.classList.add("cracked"), 900);
  setTimeout(() => st.classList.add("burst"), 1350);
  setTimeout(() => { $("#hafter").classList.add("show"); ov.querySelector("[data-act=close-hatch]").focus(); }, 1950);
}
function openShare(){
  const d = prizeDragon(); if (!d) return;
  const owned = ITEMS.filter(i => i.kind !== "egg" && S.owned[i.id]);
  const slug = (d.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "dragon") + "-" + d.id.replace(/\D/g, "").padStart(3, "0");
  const ov = $("#shareOv");
  ov.innerHTML = `<div class="card-wrap" role="dialog" aria-modal="true" aria-label="Share card">
      <div class="sharecard">
        <div class="brand">Scale Bank</div>
        <p class="cname">${esc(d.name)}</p>
        <div class="species">${STAGES[stageIdx(d)].name} ${esc(d.species)} \u00B7 <span class="r ${rcls(rarityOf(d))}">${rarityOf(d)}</span></div>
        ${d.mut ? `<div class="mutb">${MUTATIONS[d.mut].name} mutation</div>` : ""}
        <div class="stage">${dragonArt(d, {live:true})}</div>
        <ul class="parts"><li><span>Trail</span><span class="${d.trail ? "worn" : ""}">${d.trail && ITEM[d.trail] ? esc(ITEM[d.trail].name) : "None"}</span></li>
          <li><span>Trails owned</span><span>${owned.length} of ${ITEMS.filter(i => i.kind !== "egg").length}</span></li>
          <li><span>Hatched from</span><span>${esc(ITEM[d.item].name)}</span></li>
          <li><span>Walked as prize</span><span>${fmt(d.xp || 0)} steps</span></li></ul>
        <div class="cardfoot">${fmt(S.lifetime)} lifetime steps walked</div>
      </div>
      <div class="card-actions"><button class="btn" data-act="copy" data-slug="${slug}">Copy link</button><button class="btn ghost" data-act="close-share">Close</button></div>
      <div class="copied" id="copied" aria-live="polite"></div>
    </div>`;
  ov.hidden = false;
  ov.querySelector("[data-act=copy]").focus();
}

let resetArmed = false, resetT;
document.addEventListener("click", ev => {
  const tab = ev.target.closest(".tab");
  if (tab){ setTab(tab.dataset.tab); return; }
  const b = ev.target.closest("[data-act]");
  if (!b) return;
  const a = b.dataset.act;
  if (a === "add") addSteps(+b.dataset.n);
  else if (a === "buy") buy(b.dataset.id);
  else if (a === "dot") scrollToScene(+b.dataset.i, true);
  else if (a === "vf"){ VF[+b.dataset.i] = b.dataset.k; renderVendors(); }
  else if (a === "goto-stall"){ S.scene = 0; setTab("vendors"); }
  else if (a === "goto-nest") setTab("nest");
  else if (a === "nsel"){ NSEL = b.dataset.id; renderNest(); }
  else if (a === "hatch") hatch(b.dataset.id);
  else if (a === "close-hatch") closeHatch();
  else if (a === "equip"){ const d = prizeDragon(); if (d){ d[b.dataset.k] = b.dataset.v || null; save(); render(); } }
  else if (a === "prize"){ S.prize = b.dataset.id; save(); render(); }
  else if (a === "share") openShare();
  else if (a === "close-share"){ $("#shareOv").hidden = true; $("#shareOv").innerHTML = ""; autoHatch(); }
  else if (a === "copy"){
    $("#copied").innerHTML = `✓ Link copied <code>scalebank.app/d/${esc(b.dataset.slug)}</code>`;
    b.textContent = "Copied";
  }
  else if (a === "reset"){
    if (!resetArmed){
      resetArmed = true; b.classList.add("armed"); b.textContent = "Tap again to wipe everything and start at 0";
      clearTimeout(resetT); resetT = setTimeout(() => { resetArmed = false; b.classList.remove("armed"); b.textContent = "Reset to first run"; }, 3500);
      return;
    }
    resetArmed = false; b.classList.remove("armed"); b.textContent = "Reset to first run";
    S = fresh(); shown = 0; save(); scrollToScene(0, false); setTab("bank"); toast("Back to a first run. Bank at 0.");
  }
});
document.addEventListener("keydown", ev => {
  if (S.tab === "vendors" && (ev.key === "ArrowLeft" || ev.key === "ArrowRight") && $("#shareOv").hidden && $("#hatchOv").hidden
      && !(ev.target.closest && ev.target.closest("input,textarea,.fchips"))){
    ev.preventDefault();
    scrollToScene(S.scene + (ev.key === "ArrowLeft" ? -1 : 1), true);
    const tab = document.getElementById("vtab-" + S.scene); if (tab && ev.target.closest && ev.target.closest("#vrail")) tab.focus();
    return;
  }
  if (ev.key !== "Escape") return;
  if (!$("#shareOv").hidden){ $("#shareOv").hidden = true; }
  else if (!$("#hatchOv").hidden && $("#hafter")?.classList.contains("show")) closeHatch();
});
window.addEventListener("resize", () => { if (S.tab === "vendors") scrollToScene(S.scene, false); });

/* ================= boot ================= */
/* Saves from before the painted dragon lines: map old eggs and species onto the seven lines,
   and drop the retired colors and horns. */
const OLD_EGG = {ember:"ember", tide:"tide", forest:"forest", frost:"tide", inferno:"inferno", storm:"storm", void:"void", tempest:"tempest"};
const OLD_SPECIES = ["Cinder","Soot","Brine","Kelp","Moss","Fernback","Frostling","Rimeback","Inferno","Cinderking","Stormling","Pearl Stormling","Voidling","Starveil","Tempest","Stormcrown"];
function migrate(){
  S.dragons.forEach(d => {
    if (!ITEM[d.item] || ITEM[d.item].kind !== "egg") d.item = OLD_EGG[d.item] || "ember";
    if (!d.line || !DRAGONS[d.line]){
      d.line = ITEM[d.item].line;
      const sp = DRAGONS[d.line].name;
      if (!d.name || OLD_SPECIES.includes(d.name)) d.name = sp;
      d.species = sp;
    }
    if (d.mut && !MUTATIONS[d.mut]) d.mut = null;
    if (d.trail && !ITEM[d.trail]) d.trail = null;
    delete d.color; delete d.horns; delete d.base;
  });
  S.eggs.forEach(e => { if (!ITEM[e.item]) e.item = OLD_EGG[e.item] || "ember"; });
  Object.keys(S.owned).forEach(k => { if (!ITEM[k]) delete S.owned[k]; });
  Object.keys(S.bought).forEach(k => { if (!ITEM[k]) delete S.bought[k]; });
}
function start(data){
  S = (data && data.state) ? Object.assign(fresh(), data.state) : (load() || fresh());
  if (!S.opened) S.opened = {};
  migrate();
  ITEMS.forEach(it => { if (S.owned[it.id]) for (let k = 1; k <= it.scene; k++) S.opened[k] = true; });
  shown = S.bank;
  $("#balance").textContent = fmt(S.bank);
  buildScenes();
  setTab(S.tab || "bank");
  setTimeout(autoHatch, 600);
}
try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({state: S})); } catch(e){}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start(window.claude && window.claude.hot && window.claude.hot.data || {});
})();
</script>
