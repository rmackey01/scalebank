<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Scale Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Lato:wght@400;700;900&display=swap">
<style>
/* Layout: one-column phone app, three screens over a fixed bottom tab bar; vendors swipe sideways with scroll-snap. */
:root{
  --ink:#0c1015;        /* wet stone at night */
  --stone:#151b22;
  --stone-2:#1e262f;
  --line:#2c3540;
  --fg:#efe5d1;         /* lantern paper */
  --muted:#9c978b;
  --gold:#d8a94b;
  --gold-hi:#f4d78f;
  --gold-lo:#7b5517;
  --lantern:#e2583e;
  --jade:#6fbf9f;
  --display:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;  /* headings at weight 600 */
  --body:"Lato","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--ink)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--ink);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--ink);border-inline:1px solid transparent}
@media (min-width:500px){#app{border-inline-color:var(--line)}}
.screen{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.pad{padding-inline:16px}

/* ---------- tab bar ---------- */
.tabs{flex:none;position:relative;display:grid;grid-template-columns:repeat(4,1fr);margin:0 8px 11px;padding:6px 0 4px;font-family:"Lato",var(--body)}
.tabs::before{content:"";position:absolute;inset:-6px;pointer-events:none;border-style:solid;border-width:26px 24px;border-image:url(art/nest/nav_bar_bg.webp) 78 72 fill / 26px 24px stretch}
.tab{position:relative;background:none;border:0;padding:4px 2px 9.55px;display:flex;flex-direction:column;align-items:center;gap:3.65px;color:#c3b197;font-size:11.5px;line-height:13.8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tab .ti{width:30px;height:30px;display:block}
.tab .ti.on,.tab[aria-current="page"] .ti.off{display:none}
.tab[aria-current="page"] .ti.on{display:block}
.tab[aria-current="page"]{color:#eeca74}
/* One shared underline that slides to the active tab (--ti is set by setTab). */
.tab-ul{position:absolute;z-index:1;top:-4.2px;left:calc((var(--ti,0) + .5) * 25%);width:50px;height:12px;margin-left:-25px;pointer-events:none;background:url(art/nest/nav_active_underline.webp) center/100% 100% no-repeat;transition:left .25s cubic-bezier(.65,0,.35,1)}
.tab .dot{position:absolute;top:-2px;left:calc(50% + 5px);width:20px;height:20px;animation:dotpulse 1.6s ease-in-out infinite}
@keyframes dotpulse{0%,100%{opacity:.7}50%{opacity:1}}

/* ---------- shared bits ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.topbar h1{font-family:var(--display);font-weight:600;font-size:24px;margin:0;letter-spacing:.01em}
.chip{display:inline-flex;align-items:baseline;gap:5px;padding:5px 11px;border-radius:999px;border:1px solid var(--gold-lo);background:var(--stone);font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;color:var(--gold-hi);white-space:nowrap}
.chip small{font-weight:500;color:var(--muted);font-size:12px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.btn{border:1px solid var(--gold);background:linear-gradient(180deg,#e8bd5f,#b9862e);color:#1b1206;font-weight:700;border-radius:12px;padding:12px 16px;letter-spacing:.01em;box-shadow:inset 0 1px 0 rgba(255,240,200,.5),0 2px 0 #5c3d0c}
.btn:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,240,200,.5),0 1px 0 #5c3d0c}
.btn.ghost{background:transparent;color:var(--gold-hi);box-shadow:none;border-color:var(--gold-lo)}
.btn[disabled]{background:var(--stone-2);border-color:var(--line);color:var(--muted);box-shadow:none;cursor:default}
.toast{position:absolute;left:16px;right:16px;top:12px;z-index:30;background:#1b2229;border:1px solid var(--gold-lo);color:var(--fg);padding:11px 14px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:14px;transform:translateY(calc(-100% - 16px));transition:transform .3s ease}
.toast.show{transform:none}

/* ---------- bank ---------- */
#bank{display:flex;flex-direction:column;background:radial-gradient(120% 60% at 50% -10%,rgba(216,169,75,.10),transparent 60%),var(--ink)}
.bank-main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px;padding-block:24px}
.balance{font-family:var(--display);font-weight:600;font-size:clamp(64px,22vw,104px);line-height:1;letter-spacing:-.01em;color:var(--fg);font-variant-numeric:lining-nums tabular-nums;text-shadow:0 0 40px rgba(216,169,75,.18)}
.balance-unit{font-size:15px;color:var(--gold);letter-spacing:.2em;text-transform:uppercase;font-weight:600}
.afford{max-width:30ch;margin:18px auto 0;color:var(--fg);opacity:.82;font-size:15px;text-wrap:balance}
.lifetime{margin-top:22px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lifetime b{color:var(--fg);font-weight:600}
.bank-foot{padding-block:8px 18px;display:flex;flex-direction:column;gap:10px}
.step-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.step-btns .btn{padding:15px 10px;font-size:16px}
.sim-note{text-align:center;font-size:12px;color:var(--muted)}
/* Destructive: red from the start, solid red once armed. The armed state times out after 3 s. */
.reset{align-self:center;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 16px;border-radius:10px;border:1px solid rgba(226,88,62,.55);background:rgba(226,88,62,.07);color:#f0907a;font-size:13px;font-weight:700;transition:background .15s,color .15s}
.reset small{font-size:11px;font-weight:400;color:#c98f80}
.reset.armed{background:#c2412a;border-color:#f3a08b;color:#fff}
.reset.armed small{color:#ffe0d6}

/* ---------- vendors ---------- */
#vendors{display:flex;flex-direction:column;overflow:hidden}
.vrail{position:relative;flex:none;display:grid;grid-template-columns:repeat(3,1fr);margin:12px 16px 6px;padding:4px;background:var(--stone);border:1px solid var(--line);border-radius:14px}
.vtab{position:relative;z-index:1;background:none;border:0;padding:7px 4px 6px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);min-width:0;transition:color .2s}
.vtab b{font-family:var(--display);font-weight:600;font-size:15px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.vtab small{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:inline-flex;gap:3px;align-items:center;opacity:.85}
.vtab small svg{width:10px;height:10px}
.vtab[aria-selected="true"]{color:var(--gold-hi)}
.vtab.locked b{opacity:.7}
.vind{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / 3);border-radius:10px;background:linear-gradient(180deg,rgba(216,169,75,.24),rgba(216,169,75,.07));border:1px solid var(--gold-lo);transform:translateX(calc(var(--p,0) * 100%));pointer-events:none}
.scenes{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.scenes::-webkit-scrollbar{display:none}
.scene{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;padding-inline:16px;padding-block:2px 24px}
.art{position:relative;aspect-ratio:6/5;max-width:100%;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:inset 0 0 0 1px rgba(216,169,75,.18);background:#0b0d10}
.art > video{display:block;width:100%;height:100%;object-fit:cover;object-position:var(--pos,50% 50%)}
.scene.is-locked .art > video{filter:grayscale(.65) brightness(.55)}
.art .shade{position:absolute;inset:auto 0 0 0;height:58%;background:linear-gradient(180deg,transparent,rgba(8,10,13,.92));pointer-events:none}
.vtitle{position:absolute;left:14px;right:14px;bottom:12px;pointer-events:none}
.vtitle .eyebrow{color:#d9cfbd}
.vtitle h2{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.05;margin:3px 0 3px;color:#fff6e6;text-wrap:balance;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.quip{margin:0;color:#d4cab8;font-style:italic;font-size:13px}
.lockbadge{position:absolute;inset:10px 10px auto auto;display:flex;align-items:center;gap:6px;background:rgba(12,16,21,.85);border:1px solid var(--gold-lo);color:var(--gold-hi);padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.vnav{position:absolute;top:38%;transform:translateY(-50%);width:40px;height:40px;padding:0;border-radius:50%;border:1px solid rgba(244,215,143,.55);background:rgba(10,12,16,.62);color:var(--gold-hi);display:grid;place-items:center;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.vnav svg{width:18px;height:18px}
.vnav.prev{left:8px}.vnav.next{right:8px}
.vtools{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;margin-inline:-16px;padding:10px 16px 8px;background:linear-gradient(var(--ink) 78%,rgba(12,16,21,0))}
.fchips{display:flex;gap:5px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-mask:linear-gradient(90deg,#000 88%,transparent);mask:linear-gradient(90deg,#000 88%,transparent);padding-right:14px}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;display:inline-flex;align-items:baseline;gap:4px;padding:6px 9px;border-radius:999px;border:1px solid var(--line);background:var(--stone);color:var(--fg);font-size:12.5px;font-weight:600}
.fchip i{font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.fchip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-hi);background:rgba(216,169,75,.12)}
.vtools .chip{flex:none;padding:5px 10px;align-items:center;gap:5px}
.ghead{display:flex;align-items:baseline;gap:8px;margin:14px 0 8px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.ghead::after{content:"";flex:1;height:1px;background:var(--line);align-self:center}
.ghead + .list{margin-top:0}
.lockcard{margin-top:12px;border:1px solid var(--gold-lo);background:linear-gradient(180deg,rgba(216,169,75,.08),rgba(216,169,75,.02));border-radius:14px;padding:14px}
.lockcard p{margin:0 0 10px}
.missing{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.missing li{display:flex;justify-content:space-between;gap:12px;font-weight:600}
.missing li span:last-child{font-variant-numeric:tabular-nums;color:var(--gold-hi);white-space:nowrap}
.lockcard .btn{margin-top:12px;width:100%}
.list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.list.teaser{opacity:.45;pointer-events:none}
.item{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--stone);border:1px solid var(--line)}
.item.owned{background:transparent}
.thumb{position:relative;width:76px;height:76px;display:grid;place-items:center;border-radius:12px;background:radial-gradient(70% 60% at 50% 70%,#2a221a,#14181e);border:1px solid #2a2a26;overflow:hidden}
.thumb .shopegg{position:absolute;left:50%;top:50%;width:92px;height:92px;max-width:none;transform:translate(-50%,-58%)}
.thumb .dart.tthumb{position:absolute;inset:0;width:auto;aspect-ratio:auto;background:none;border-radius:0}
.thumb .dart.tthumb::after{display:none}
.kind{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.kind.r-uncommon{color:#93cf86}
.kind.r-rare,.r.r-rare{color:#b9b6f0}
.kind.r-epic,.r.r-epic{color:#d6a2ff}
.kind.r-legendary,.r.r-legendary{color:#ffd27a;text-shadow:0 0 10px rgba(255,200,100,.45)}
.r.r-common{color:var(--gold)} .r.r-uncommon{color:#93cf86}
.odds{display:flex;flex-wrap:wrap;gap:4px 6px;margin:-2px 0 9px}
.odds span{font-size:11px;color:var(--muted);background:var(--ink);border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-variant-numeric:tabular-nums}
.odds b{color:var(--fg);font-weight:600}
.odds .mut{border-color:rgba(190,160,255,.45);color:#cdb8ff}
.odds .mut b{color:#e6dcff}
.buyrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bought{font-size:12px;color:var(--jade);font-weight:600}
.iname{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.2;margin:1px 0 2px}
.hint{font-size:13px;color:var(--muted);margin:0 0 8px}
.buy{min-width:118px;padding:8px 12px;border-radius:10px;font-variant-numeric:tabular-nums;text-align:left;display:inline-flex;flex-direction:column;line-height:1.2}
.buy small{font-weight:500;font-size:11px;opacity:.85}
.buy.confirm{background:linear-gradient(180deg,#f07a5e,#c2412a);border-color:#f3a08b;color:#fff;box-shadow:inset 0 1px 0 rgba(255,220,200,.4),0 2px 0 #6a1b0f}
.owned-tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--jade)}
.empty-stock{margin-top:14px;padding:22px 16px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}

/* ---------- dragon screen ---------- */
.frame{position:relative;margin-top:4px;border-radius:20px;padding:18px 16px 18px;text-align:center;background:radial-gradient(80% 55% at 50% 45%,rgba(216,169,75,.16),transparent 70%),linear-gradient(180deg,#19140f,#101318);border:1px solid var(--gold-lo);box-shadow:inset 0 0 0 4px #0f1216,inset 0 0 0 5px rgba(216,169,75,.35)}
.plaque{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#1b1206;background:linear-gradient(180deg,var(--gold-hi),var(--gold));padding:4px 12px;border-radius:4px}
.stage{display:grid;place-items:center;margin-block:4px}
.stage .dart{width:min(240px,62vw)}
.pname{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.1;margin:0;overflow-wrap:anywhere}
.species{font-size:13px;color:var(--muted)}
.frame.empty .stage{position:relative;width:min(240px,62vw);margin-inline:auto}
.padlock{position:absolute;inset:0;display:grid;place-items:center}
.padlock svg{width:54px;height:54px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.6))}
.frame.empty .pname{color:var(--muted)}
.frame.empty p{margin:8px auto 14px;max-width:32ch;color:var(--fg);opacity:.85;text-wrap:balance}
.section{margin-top:22px}
.section h2{font-family:var(--display);font-weight:600;font-size:21px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.section h2 small{font-family:var(--body);font-size:12px;color:var(--muted)}
.custom{display:flex;flex-direction:column;gap:14px;background:var(--stone);border:1px solid var(--line);border-radius:16px;padding:14px}
.crow{display:flex;flex-direction:column;gap:7px}
.crow label,.crow .lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.crow input{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);font:inherit;font-size:16px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--ink);font-size:14px;font-weight:600}
.opt[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-hi);background:rgba(216,169,75,.1)}
.sw{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.25)}
.none-note{font-size:13px;color:var(--muted);margin:0}
.share-btn{width:100%;margin-top:14px;padding:14px;font-size:16px}
/* ---------- nest (asset pack, handoff/nest-spec.md) ---------- */
/* Every length is in spec px on the 390-wide frame (--u). z-index values are the spec's layer numbers (§3). */
@property --edge{syntax:"<number>";inherits:true;initial-value:0}
@property --sp{syntax:"<number>";inherits:true;initial-value:0}
#nest{padding-inline:0;overflow-x:hidden;background:#03060b url(art/nest/background.webp) center top/cover no-repeat}
.hx{container-type:inline-size;width:100%}
/* The backdrop lives on the stage too, so the screen-blended embers and glows have something to blend with. */
.hx-in{--u:calc(100cqw / 390);position:relative;width:100%;overflow:hidden;font-family:"Lato",var(--body);background:#03060b url(art/nest/background.webp) center top/100% auto no-repeat}
.hx-in > *,.hx-dyn > *{position:absolute}
.hx-dyn{inset:0}
.hx-in img{display:block;user-select:none;-webkit-user-drag:none}
.hx-in .em{left:0;top:0;width:calc(24*var(--u));height:calc(24*var(--u));pointer-events:none;mix-blend-mode:screen}
.hx-in .em img{width:100%;height:100%}
.hx-banner{z-index:12;background:url(art/nest/banner_panel.webp) center/100% 100% no-repeat}
.hx-btext,.hx-status,.hx-caps,.hx-body{margin:0;text-shadow:0 calc(.6*var(--u)) calc(.8*var(--u)) rgba(0,0,0,.6)}
.hx-btext,.hx-status,.hx-body{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hx-btext{z-index:12;font-size:calc(16*var(--u));line-height:calc(21*var(--u));color:#f5e5c1}
.hx-cab-back{z-index:2;border-style:solid;border-width:calc(24*var(--u)) calc(22*var(--u)) calc(30*var(--u));border-image:url(art/nest/cabinet_back.webp) 72 66 90 fill / calc(24*var(--u)) calc(22*var(--u)) calc(30*var(--u)) stretch;box-sizing:border-box}
.hx-cab-frame{z-index:11;pointer-events:none;border-style:solid;border-image:url(art/nest/cabinet_frame.webp) 168 102 126 / calc(56*var(--u)) calc(34*var(--u)) calc(42*var(--u)) stretch;border-width:calc(56*var(--u)) calc(34*var(--u)) calc(42*var(--u));box-sizing:border-box}
/* Glows from build_mockup.py: each is drawn twice, once normally and once screened. */
.hx-blight{z-index:3;border-radius:50%;background:#5a3216;opacity:.22;filter:blur(calc(18*var(--u)))}
.hx-spill{z-index:6;height:calc(16*var(--u));width:calc(92*max(var(--sp),.35)*var(--u));border-radius:50%;background:var(--c);opacity:.4;filter:blur(calc(5*var(--u)));transition:--sp .6s cubic-bezier(.33,1,.68,1)}
.hx-blight.scr,.hx-spill.scr{mix-blend-mode:screen}
.hx-shelf{z-index:5}
.hx-conn{z-index:9}
.hx-ring{z-index:4;overflow:hidden;pointer-events:none;animation:ringin .6s cubic-bezier(.33,1,.68,1) both}
.hx-ring.held{animation:none}
.hx-ring > img{width:100%;height:100%}
/* The 12x8 sprite sheet is stepped by background position, so only the ring's own box is ever
   painted (moving a transformed sheet 12x8 times its size is too large a layer for Safari).
   --rd keeps the loop's phase when the Nest re-renders. */
.hx-ring .rs{width:100%;height:100%;background:url(art/nest/ring_sheet.webp) 0 0/1200% 800% no-repeat;animation:rsx .5s steps(12) infinite,rsy 4s steps(8) infinite;animation-delay:var(--rd,0s)}
@keyframes rsx{to{background-position-x:109.0909%}}
@keyframes rsy{to{background-position-y:114.2857%}}
@keyframes ringin{from{opacity:0;transform:scale(.85)}}
.hx-slot{z-index:7;padding:0;border:0;background:none;cursor:pointer;transform-origin:50% 95%;transition:transform .12s}
.hx-slot img{position:relative;width:100%;height:100%}
.hx-slot:active{transform:scale(.96)}
.hx-slot .glow{position:absolute;left:10%;right:10%;top:0;bottom:12%;border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,rgba(255,176,90,calc(.05 + var(--p) * .22)),transparent)}

/* ================= state ================= */

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const rcls = r => "r-" + r.toLowerCase();

let toastT;

/* ================= growth reveal system (growth-reveal-spec) ================= */
function revealSrc(line, key){ return `art/reveals/${line}-${key}`; }

const CHANGE_WIDTH = 880;
const CHANGE_MARGIN = 64;
let measureCtx = null;
function getMeasureCtx(){ if (!measureCtx){ const c = document.createElement("canvas"); measureCtx = c.getContext("2d"); } return measureCtx; }

async function packChangeLines(text, maxLines, baseFontSize, lineHeight, k){
  const innerWidth = CHANGE_WIDTH * k;
  const ctx = getMeasureCtx();
  let fontSize = baseFontSize;
  let lh = lineHeight;
  const minFontSize = baseFontSize * 0.85;
  
  await document.fonts.ready;
  await document.fonts.load(`400 ${fontSize * k}px Lato`);
  
  const pack = (fs, lh) => {
    ctx.font = `400 ${fs * k}px Lato`;
    const phrases = text.split(" · ");
    const sep = " · ";
    const sepW = ctx.measureText(sep).width;
    const lines = [];
    let cur = "", curW = 0;
    for (const p of phrases){
      const pW = ctx.measureText(p).width;
      if (cur === ""){ cur = p; curW = pW; }
      else if (curW + sepW + pW <= innerWidth){ cur += sep + p; curW += sepW + pW; }
      else { lines.push(cur); cur = p; curW = pW; }
    }
    if (cur) lines.push(cur);
    return { lines, fs, lh };
  };
  
  let result = pack(fontSize, lh);
  while (result.lines.length > maxLines && fontSize > minFontSize){
    fontSize -= 1;
    lh = Math.round(lineHeight * fontSize / baseFontSize);
    result = pack(fontSize, lh);
  }
  return result;
}
const REVEAL_OK = new Map();
function revealAvailable(line, key){
  const id = `${line}-${key}`;
  if (!REVEAL_OK.has(id)){
    REVEAL_OK.set(id, Promise.race([
      fetch(`${revealSrc(line, key)}-poster.webp`, {method:"HEAD", cache:"no-cache"}).then(r => r.ok).catch(() => false),
      new Promise(res => setTimeout(() => res(false), 1500))
    ]));
  }
  return REVEAL_OK.get(id);
}

let revealActive = null, revealFocusReturn = null;

function startGrowth(grow, msgs){
  const {d, was, now} = grow;
  const key = REVEAL_KEY[now];
  if (!key){ fallbackGrowth(d, now, msgs); return; }
  revealAvailable(d.line, key).then(ok => {
    if (ok) openReveal(d, was, now, key);
    else fallbackGrowth(d, now, msgs);
  });
}

function fallbackGrowth(d, now, msgs){
  toast(`${d.name} grew into ${an(STAGES[now].name)}.`);
  autoHatch();
}

function openReveal(d, was, now, key){
  const ov = $("#revealOv");
  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const seen = d.reveals && d.reveals[key];
  const panelH = PANEL_H[`${d.line}-${key}`] || 600;
  const cardTop = 1724 - panelH;
  const cardH = 36 + panelH;
  const extra = panelH - 600;
  const changeKey = `${d.line}-${key}`;
  const changeText = CHANGE_LINES[changeKey] || "";
  const baseFontSize = (panelH === 636 || panelH === 672) ? 28 : 31;
  const baseLineHeight = baseFontSize === 28 ? 36 : 40;
  const maxLines = Math.round((panelH - 600) / baseLineHeight) + 1;

  revealActive = {d, was, now, key, seen, reducedMotion, burstTime: 0, payoffReady: false, skipUnlocked: seen, panelH, changeText, baseFontSize, baseLineHeight, maxLines, changePacked: false};
  revealFocusReturn = document.activeElement;

  const arrowSVG = `<svg viewBox="0 0 170 64" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="rvag" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFE6A0"/><stop offset=".5" stop-color="#F3C859"/><stop offset="1" stop-color="#C68A30"/></linearGradient></defs><path d="M2 4L42 32L2 60L12 32Z M57 4L97 32L57 60L67 32Z M112 4L152 32L112 60L122 32Z" fill="url(#rvag)"/></svg>`;

  let mediaHTML;
  if (reducedMotion){
    mediaHTML = `<img class="rv-still" src="${revealSrc(d.line, key)}-poster.webp" alt="">`;
  } else {
    mediaHTML = `<video id="rvVideo" muted playsinline autoplay preload="auto" disablepictureinpicture style="opacity:0">
      <source src="${revealSrc(d.line, key)}.webm" type="video/webm">
      <source src="${revealSrc(d.line, key)}.mp4" type="video/mp4">
    </video>`;
  }

  ov.innerHTML = `<div class="rv-frame" id="rvFrame" role="dialog" aria-modal="true" aria-label="${d.name} grew into ${an(STAGES[now].name)}">
    ${mediaHTML}
    <button class="rv-hit${seen ? "" : " locked"}" id="rvHit" aria-label="Skip to the result"></button>
    <div class="rv-card${reducedMotion ? " show" : ""}" id="rvCard" data-panel-h="${panelH}">
      <div class="rv-card-inner"></div>
      <div class="rv-card-border"></div>
      <div class="rv-portraits">
        <div class="rv-portrait"><img src="art/nest/portrait_backing.webp" alt=""><img class="pe" src="${stageSrc(d.line, was)}.webp" alt=""><img src="art/nest/portrait_frame.webp" alt=""></div>
        <div class="rv-portrait"><img src="art/nest/portrait_backing.webp" alt=""><img class="pe" src="${stageSrc(d.line, now)}.webp" alt=""><img src="art/nest/portrait_frame.webp" alt=""></div>
      </div>
      <div class="rv-arrow">${arrowSVG}</div>
      <div class="rv-labels"><span class="rv-label from">${STAGES[was].name}</span><span class="rv-label to">${STAGES[now].name}</span></div>
      <div class="rv-change" id="rvChange" data-extra="${extra}"></div>
      <div class="rv-divider" data-extra="${extra}"></div>
      <div class="rv-steps" data-extra="${extra}"><span class="num">${fmt(d.xp)}</span> <span class="txt">steps walked together</span></div>
    </div>
    <button class="rv-continue" id="rvContinue"${reducedMotion ? "" : " hidden"}>Continue</button>
    <p class="sr-only" aria-live="polite">${d.name} grew into ${an(STAGES[now].name)}.</p>
  </div>`;
  ov.hidden = false;
  sizeRevealFrame();
  packAndRenderChange();

  if (!reducedMotion){
    const video = $("#rvVideo");
    let loadTimeout = setTimeout(() => { closeRevealFallback(); }, 4000);
    const clearLoad = () => { clearTimeout(loadTimeout); loadTimeout = null; };
    video.addEventListener("loadeddata", clearLoad, {once:true});
    video.addEventListener("error", () => { if (loadTimeout) closeRevealFallback(); }, {once:true});
    for (const src of video.querySelectorAll("source")){
      src.addEventListener("error", () => {
        if (!video.currentSrc && loadTimeout) closeRevealFallback();
      }, {once:true});
    }
    video.addEventListener("playing", () => { video.style.opacity = "1"; }, {once:true});
    video.play().catch(() => { closeRevealFallback(); });
    if (video.requestVideoFrameCallback) {
      const rvfc = () => { onRevealTime(); if (!revealActive?.payoffReady) video.requestVideoFrameCallback(rvfc); };
      video.requestVideoFrameCallback(rvfc);
    } else {
      video.addEventListener("timeupdate", onRevealTime);
    }
    video.addEventListener("ended", onRevealEnded);
    document.addEventListener("visibilitychange", onRevealVisibility);
  } else {
    markRevealSeen();
  }
}

function closeRevealFallback(){
  const ov = $("#revealOv");
  if (ov.hidden) return;
  ov.hidden = true; ov.innerHTML = "";
  if (revealActive) fallbackGrowth(revealActive.d, revealActive.now, []);
  revealActive = null;
}

function sizeRevealFrame(){
  const ov = $("#revealOv"), frame = $("#rvFrame"), card = $("#rvCard");
  if (!frame) return;
  const k = Math.min(ov.clientWidth / 1080, ov.clientHeight / 1920);
  frame.style.width = `${1080 * k}px`;
  frame.style.height = `${1920 * k}px`;
  if (card){
    const panelH = parseInt(card.dataset.panelH) || 600;
    const cardTop = 1724 - panelH;
    const cardH = 36 + panelH;
    const extra = panelH - 600;
    card.style.setProperty("--k", k);
    card.style.left = `${36 * k}px`;
    card.style.top = `${cardTop * k}px`;
    card.style.width = `${1008 * k}px`;
    card.style.height = `${cardH * k}px`;
    const portraits = card.querySelector(".rv-portraits");
    if (portraits) portraits.style.top = `${43 * k}px`;
    const arrow = card.querySelector(".rv-arrow");
    if (arrow) arrow.style.top = `${(148 - 32) * k}px`;
    const labels = card.querySelector(".rv-labels");
    if (labels) labels.style.top = `${259 * k}px`;
    const change = card.querySelector(".rv-change");
    if (change) change.style.top = `${328 * k}px`;
    const divider = card.querySelector(".rv-divider");
    if (divider) divider.style.top = `${(398 + extra) * k}px`;
    const steps = card.querySelector(".rv-steps");
    if (steps) steps.style.top = `${(416 + extra) * k}px`;
  }
  frame.querySelectorAll(".rv-continue").forEach(c => c.style.setProperty("--k", k));
}

async function packAndRenderChange(){
  const ra = revealActive;
  if (!ra || ra.changePacked) return;
  const change = $("#rvChange"), card = $("#rvCard");
  if (!change || !card) return;
  const k = parseFloat(card.style.getPropertyValue("--k")) || 1;
  const {changeText, baseFontSize, baseLineHeight, maxLines} = ra;
  const result = await packChangeLines(changeText, maxLines, baseFontSize, baseLineHeight, k);
  if (!revealActive || revealActive !== ra) return;
  ra.changePacked = true;
  change.innerHTML = result.lines.map(l => `<span>${esc(l)}</span>`).join("");
  change.style.fontSize = `${result.fs * k}px`;
  change.style.lineHeight = `${result.lh * k}px`;
}

function getT(video){
  const shift = video.duration > 14.5 ? video.duration - 14.02 : 0;
  return x => x + (x > 4.6 ? shift : 0);
}

function onRevealTime(){
  const video = $("#rvVideo"), ra = revealActive;
  if (!video || !ra) return;
  const T = getT(video), t = video.currentTime;
  if (!ra.skipUnlocked && t >= T(6.10)){
    ra.skipUnlocked = true;
    const hit = $("#rvHit"); if (hit) hit.classList.remove("locked");
  }
  if (!ra.cardStarted && t >= T(10.25)){
    ra.cardStarted = true;
    const card = $("#rvCard");
    if (card){
      const panelH = PANEL_H[`${ra.d.line}-${ra.key}`] || 600;
      const k = parseFloat(card.style.getPropertyValue("--k")) || 1;
      const fullD = (2280 - (1742 - panelH/2)) * k;
      const late = Math.max(0, t - T(10.25));
      const progress = Math.min(1, late / 0.6);
      const startD = fullD * (1 - progress);
      const remainDur = Math.max(0.05, 0.6 - late);
      const startOpacity = Math.min(1, late / 0.375);
      card.style.transition = "none";
      card.style.transform = `translateY(${startD}px)`;
      card.style.opacity = String(startOpacity);
      card.offsetHeight;
      card.style.transition = `transform ${remainDur}s cubic-bezier(.215,.61,.355,1), opacity ${Math.min(0.375, remainDur)}s`;
      card.classList.add("show");
      card.style.transform = "translateY(0)";
      card.style.opacity = "1";
    }
  }
  if (!ra.continueEnabled && t >= T(12.45)){
    ra.continueEnabled = true;
    const btn = $("#rvContinue"); if (btn){ btn.hidden = false; btn.focus(); }
    markRevealSeen();
  }
  if (t >= T(12.95) && !ra.payoffReady){
    ra.payoffReady = true;
    const hit = $("#rvHit"); if (hit) hit.style.pointerEvents = "none";
  }
}

function onRevealEnded(){
  const ra = revealActive;
  if (!ra) return;
  ra.payoffReady = true;
  const btn = $("#rvContinue");
  if (btn && btn.hidden){ btn.hidden = false; btn.focus(); }
  const hit = $("#rvHit"); if (hit) hit.style.pointerEvents = "none";
  markRevealSeen();
}

function onRevealVisibility(){
  const video = $("#rvVideo");
  if (!video) return;
  if (document.hidden) video.pause(); else video.play().catch(() => {});
}

function skipReveal(){
  const ra = revealActive, video = $("#rvVideo");
  if (!ra || !ra.skipUnlocked) return;
  ra.cardStarted = true;
  ra.payoffReady = true;
  ra.continueEnabled = true;
  if (video){
    video.style.opacity = "1";
    const T = getT(video);
    video.currentTime = T(12.95);
    video.play().catch(() => {});
  }
  const card = $("#rvCard");
  if (card){ card.style.transition = "none"; card.style.transform = ""; card.style.opacity = "1"; card.classList.add("show"); }
  const btn = $("#rvContinue"); if (btn){ btn.hidden = false; btn.focus(); }
  const hit = $("#rvHit"); if (hit) hit.style.pointerEvents = "none";
  markRevealSeen();
}

function markRevealSeen(){
  const ra = revealActive;
  if (!ra || ra.markedSeen) return;
  ra.markedSeen = true;
  if (!ra.d.reveals) ra.d.reveals = {};
  ra.d.reveals[ra.key] = true;
  save();
}

function closeReveal(){
  const ov = $("#revealOv"), ra = revealActive;
  if (!ra) return;
  ra.d.seenStage = ra.now;
  markRevealSeen();
  save();

  const video = $("#rvVideo");
  if (video){
    video.removeEventListener("timeupdate", onRevealTime);
    video.removeEventListener("ended", onRevealEnded);
    document.removeEventListener("visibilitychange", onRevealVisibility);
    video.pause();
    video.removeAttribute("src");
    video.load();
  }

  ov.hidden = true; ov.innerHTML = "";
  revealActive = null;
  render();
  autoHatch();
  if (revealFocusReturn && revealFocusReturn.focus) revealFocusReturn.focus();
  revealFocusReturn = null;
}

function replayReveal(d){
  const si = stageIdx(d);
  if (si < 1) return;
  const key = REVEAL_KEY[si];
  if (!key) return;
  revealAvailable(d.line, key).then(ok => {
    if (ok) openReveal(d, si - 1, si, key);
    else toast("Reveal video not available.");
  });
}

let shown = 0, raf;
function countTo(n){
  cancelAnimationFrame(raf);
  const from = shown, t0 = performance.now(), dur = Math.min(900, 300 + Math.abs(n-from)/4);
  const el = $("#balance");
  const step = now => {
    const k = Math.min(1, (now - t0)/dur), e = 1 - Math.pow(1-k, 3);
    shown = from + (n - from)*e; el.textContent = fmt(shown);
    if (k < 1) raf = requestAnimationFrame(step); else shown = n;
  };
  if (matchMedia("(prefers-reduced-motion: reduce)").matches){ shown = n; el.textContent = fmt(n); return; }
  raf = requestAnimationFrame(step);
}
function affordScene(){
  if (sceneOpen(S.scene)) return S.scene;
  let s = 0; while (s + 1 < SCENES.length && sceneOpen(s + 1)) s++;

}
function affordLine(){
  const s = affordScene(), sc = SCENES[s], stock = itemsIn(s);

  const left = stock.filter(i => i.kind === "egg" || !S.owned[i.id]).sort((a,b) => a.price - b.price);
  const can = left.filter(i => i.price <= S.bank);
  if (!can.length) return `${fmt(left[0].price - S.bank)} steps short of ${left[0].name}, the cheapest thing at the ${sc.name}.`;
  if (can.length === left.length) return `Enough for anything at the ${sc.name}.`;
  if (can.length <= 2) return `Enough for ${listJoin(can.map(i => i.name))} at the ${sc.name}.`;

function nestOrder(){ return S.eggs.slice().sort((a, b) => pctOf(b) - pctOf(a) || stepsLeft(a) - stepsLeft(b)); }
const P = (x, y, w, h) => `left:calc(${x}*var(--u));top:calc(${y}*var(--u));width:calc(${w}*var(--u));height:calc(${h}*var(--u))`;

/* Embers (spec §10): 0.6–1.2 spawns a second while the Nest is open, at most 24 alive, each living
   4–7 s, rising 12–30 px/s with a sine sway. Most rise along the edges; about one in seven drifts behind the cabinet. */
let emT = 0;
function spawnEmber(seed){
  const stage = $("#nestBody .hx-in");
  if (!stage || stage.querySelectorAll(".em").length >= 24) return;
  const R = (a, b) => a + Math.random() * (b - a), u = stage.offsetWidth / 390;
  if (!u) return;
  const H = stage.offsetHeight / u;
  const back = Math.random() < .15;
  const x = back ? R(40, 350) : Math.random() < .5 ? R(0, 30) : R(360, 390), y = R(.4 * Math.min(H, 844), H);
  const life = R(4, 7), rise = R(12, 30) * life, amp = R(6, 14), per = R(2, 4), sc = R(.5, 1.2);
  const el = document.createElement("i");
  el.className = "em"; el.style.zIndex = back ? 1 : 17;
  el.style.left = `calc(${(x - 12).toFixed(1)}*var(--u))`; el.style.top = `calc(${(y - 12).toFixed(1)}*var(--u))`;
  el.innerHTML = `<img src="${NA}ember_0${1 + Math.floor(Math.random() * 6)}.webp" alt="">`;
  stage.appendChild(el);
  const a = el.animate([{transform:"translateY(0)", opacity:0}, {opacity:1, offset:.4 / life}, {opacity:1, offset:(life - 1.5) / life}, {transform:`translateY(${(-rise * u).toFixed(1)}px)`, opacity:0}],
    {duration:life * 1000, easing:"linear"});
  el.firstChild.animate([{transform:`translateX(${(-amp * u).toFixed(1)}px) scale(${sc.toFixed(2)})`}, {transform:`translateX(${(amp * u).toFixed(1)}px) scale(${sc.toFixed(2)})`}],
    {duration:per * 500, direction:"alternate", iterations:Infinity, easing:"ease-in-out", delay:-Math.random() * per * 1000});
  if (seed) a.currentTime = Math.random() * life * 1000;
  a.onfinish = () => el.remove();
}
function syncEmbers(){
  const on = S.tab === "nest" && !matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (on && !emT){
    for (let i = 0; i < 4; i++) spawnEmber(true);
    const tick = () => { if (S.tab !== "nest"){ emT = 0; return; } spawnEmber(false); emT = setTimeout(tick, 1000 / (0.6 + Math.random() * 0.6)); };
    emT = setTimeout(tick, 900);
  } else if (!on && emT){ clearTimeout(emT); emT = 0; }
}

function addSteps(n){
  S.bank += n; S.lifetime += n;
  const msgs = [], p = prizeDragon();
  let grow = null;
  if (p){
    const was = stageIdx(p); p.xp = (p.xp || 0) + n;
    const now = stageIdx(p);
    if (now > was) grow = {d: p, was, now};
  }
  save(); render();
  if (grow) startGrowth(grow, msgs);
  else { if (msgs.length) toast(msgs.join(" ")); autoHatch(); }
}
function buy(id){
  const it = ITEM[id];
  if (!it || (it.kind !== "egg" && S.owned[id]) || S.bank < it.price || !sceneOpen(it.scene)) return;
  if (pending !== id){
    pending = id; clearTimeout(pendingT);
    pendingT = setTimeout(() => { pending = null; render(); }, 3000);
    render(); return;
  }
  pending = null; clearTimeout(pendingT);
  const wasOpen = SCENES.map((_, i) => sceneOpen(i));
  S.bank -= it.price; S.owned[id] = true;
  if (it.kind === "egg") S.bought[id] = (S.bought[id] || 0) + 1;
  if (it.kind === "egg"){
    S.eggs.push({id: "egg" + (S.seq++), item: id, at: S.lifetime});
    toast(`${it.name} is in your nest. It cracks after ${fmt(it.hatch)} more steps.`);
  } else {
    const d = prizeDragon();
    if (d && !d[it.kind]){ d[it.kind] = id; toast(`${it.name} bought and put on ${d.name}.`); }
    else toast(`${it.name} bought. Equip it on the Dragon screen.`);
  }
  const opened = SCENES.findIndex((_, i) => sceneOpen(i) && !wasOpen[i]);
  if (opened > 0) setTimeout(() => toast(`The ${SCENES[opened].name} is open. Tap it above or swipe over.`), 1600);
  save(); render();
}
function rollMutation(it){
  if (Math.random() >= RARITY[it.rarity].mut) return null;
  const keys = Object.keys(MUTATIONS);
  return keys[Math.floor(Math.random() * keys.length)];
}
/* Eggs hatch the moment they're ready, on whatever screen is open. If several come due at once

const HQ = []; let hatchGo = null;

  S.eggs.filter(eggReady).forEach(e => { if (!HQ.includes(e.id)) HQ.push(e.id); });
  if ($("#hatchOv").hidden && $("#shareOv").hidden) nextHatch();
}
function nextHatch(){
  while (HQ.length){ const id = HQ.shift(); if (S.eggs.some(e => e.id === id)){ hatch(id); return; } }
}
function closeHatch(){
  $("#hatchOv").hidden = true; $("#hatchOv").innerHTML = "";
  if (HQ.length){ render(); setTimeout(nextHatch, 350); return; }
  const go = hatchGo; hatchGo = null;
  if (go) setTab(go); else render();
}

      skipReveal(); return;
    }
    if (ev.target.id === "rvContinue" || ev.target.closest("#rvContinue")){
      closeReveal(); return;
    }
  }
  const tab = ev.target.closest(".tab");
  if (tab){ setTab(tab.dataset.tab); return; }
  const b = ev.target.closest("[data-act]");
  if (!b) return;
  const a = b.dataset.act;
  if (a.startsWith("dbg-")) debugAct(a, b);
  else if (a === "add") addSteps(+b.dataset.n);
  else if (a === "buy") buy(b.dataset.id);
  else if (a === "dot") scrollToScene(+b.dataset.i, true);
  else if (a === "vf"){ VF[+b.dataset.i] = b.dataset.k; renderVendors(); }
  else if (a === "goto-stall"){ S.scene = 0; setTab("vendors"); }
  else if (a === "goto-nest") setTab("nest");
  else if (a === "nsel"){ NSEL = b.dataset.id; renderNest(); }
  else if (a === "hatch") hatch(b.dataset.id);
  else if (a === "close-hatch") closeHatch();
  else if (a === "equip"){ const d = prizeDragon(); if (d){ d[b.dataset.k] = b.dataset.v || null; save(); render(); } }
  else if (a === "prize"){ S.prize = b.dataset.id; save(); render(); }
  else if (a === "replay-reveal"){ const d = S.dragons.find(x => x.id === b.dataset.id); if (d) replayReveal(d); }
  else if (a === "share") openShare();
  else if (a === "close-share"){ $("#shareOv").hidden = true; $("#shareOv").innerHTML = ""; autoHatch(); }
  else if (a === "copy"){
    $("#copied").innerHTML = `✓ Link copied <code>scalebank.app/d/${esc(b.dataset.slug)}</code>`;
    b.textContent = "Copied";
  }
  else if (a === "reset"){
    if (!resetArmed){
      resetArmed = true; b.classList.add("armed"); b.innerHTML = RESET_ARMED;
      clearTimeout(resetT); resetT = setTimeout(() => { resetArmed = false; b.classList.remove("armed"); b.innerHTML = RESET_IDLE; }, 3000);
      return;
    }
    clearTimeout(resetT); resetArmed = false; b.classList.remove("armed"); b.innerHTML = RESET_IDLE;
    S = fresh(); shown = 0; save(); scrollToScene(0, false); setTab("bank"); toast("Back to a first run. Bank at 0.");
  }
});
document.addEventListener("keydown", ev => {
  if (S.tab === "vendors" && (ev.key === "ArrowLeft" || ev.key === "ArrowRight") && $("#shareOv").hidden && $("#hatchOv").hidden && $("#revealOv").hidden
      && !(ev.target.closest && ev.target.closest("input,textarea,.fchips"))){
    ev.preventDefault();
    scrollToScene(S.scene + (ev.key === "ArrowLeft" ? -1 : 1), true);
    const tab = document.getElementById("vtab-" + S.scene); if (tab && ev.target.closest && ev.target.closest("#vrail")) tab.focus();
    return;
  }
  if (ev.key !== "Escape") return;
  /* Reveal overlay: Escape skips (if allowed) or closes (if payoff ready) */
  if (!$("#revealOv").hidden && revealActive){
    if (revealActive.payoffReady){ closeReveal(); return; }
    if (revealActive.skipUnlocked){ skipReveal(); return; }
    return;
  }
  if (!$("#shareOv").hidden){ $("#shareOv").hidden = true; }
  else if (!$("#hatchOv").hidden && $("#hafter")?.classList.contains("show")) closeHatch();
});
window.addEventListener("resize", () => { if (S.tab === "vendors") scrollToScene(S.scene, false); });

/* ================= debug panel ================= */
/* For testing late-game states without thousands of taps. Only shown with ?debug=1 or #debug. */
const DEBUG = /[?&]debug=1(&|$)/.test(location.search) || location.hash === "#debug";

/* Debug URL params: ?debug=1&xp=N sets prize dragon xp, &dragon=line picks dragon, &eggsteps=N sets eggs' steps-left */
function applyDebugParams(){
  if (!DEBUG) return;
  const params = new URLSearchParams(location.search);
  const xpVal = params.get("xp");
  const dragonLine = params.get("dragon");
  const eggStepsLeft = params.get("eggsteps");

  /* Select dragon by line if specified */
  if (dragonLine){
    const d = S.dragons.find(x => x.line === dragonLine.toLowerCase());
    if (d){ S.prize = d.id; }
  }

  /* Set xp on prize dragon */
  if (xpVal !== null){
    const p = prizeDragon();
    if (p){ p.xp = Math.max(0, parseInt(xpVal, 10) || 0); }
  }

  /* Set egg steps-left */
  if (eggStepsLeft !== null){
    const left = Math.max(0, parseInt(eggStepsLeft, 10) || 0);
    S.eggs.forEach(e => { e.at = S.lifetime - (ITEM[e.item].hatch - left); });
  }

  save();
}
function debugPanel(){
  const el = document.createElement("details");
  el.className = "dbg";
  el.innerHTML = `<summary>Debug</summary>
    <div class="row"><span>Bank</span><input id="dbgBank" type="number" min="0" step="1000" inputmode="numeric"><button data-act="dbg-bank">Set</button></div>
    <div class="row"><span>Walk</span><input id="dbgWalk" type="number" min="1" step="1000" value="50000" inputmode="numeric"><button data-act="dbg-walk">Add steps</button></div>
    <div class="row"><span>Prize</span>${STAGES.map((st, i) => `<button data-act="dbg-stage" data-i="${i}">${st.name}</button>`).join("")}</div>
    <div class="row"><span>Eggs</span><button data-act="dbg-left" data-n="2000">2,000 left</button><button data-act="dbg-left" data-n="1">1 left</button><button data-act="dbg-left" data-n="0">Hatch all</button></div>
    <p>Time of day and streak controls come with those features. The game doesn\u2019t use either yet.</p>`;
  $("#app").appendChild(el);
  el.addEventListener("toggle", () => { if (el.open) $("#dbgBank").value = S.bank; });
}
function debugAct(a, b){
  if (a === "dbg-bank"){ S.bank = Math.max(0, Math.round(+$("#dbgBank").value || 0)); save(); render(); }
  else if (a === "dbg-walk"){ const n = Math.round(+$("#dbgWalk").value || 0); if (n > 0) addSteps(n); $("#dbgBank").value = S.bank; }
  else if (a === "dbg-stage"){ const d = prizeDragon(); if (!d){ toast("No prize dragon yet."); return; } d.xp = STAGES[+b.dataset.i].at; save(); render(); }
  else if (a === "dbg-left"){ const n = +b.dataset.n; S.eggs.forEach(e => { e.at = S.lifetime - ITEM[e.item].hatch + n; }); save(); render(); autoHatch(); }
}

/* ================= boot ================= */
/* Saves from before the painted dragon lines: map old eggs and species onto the seven lines,
   and drop the retired colors and horns. */
const OLD_EGG = {ember:"ember", tide:"tide", forest:"forest", frost:"tide", inferno:"inferno", storm:"storm", void:"void", tempest:"tempest"};
const OLD_SPECIES = ["Cinder","Soot","Brine","Kelp","Moss","Fernback","Frostling","Rimeback","Inferno","Cinderking","Stormling","Pearl Stormling","Voidling","Starveil","Tempest","Stormcrown"];
function migrate(){
  S.dragons.forEach(d => {
    if (!ITEM[d.item] || ITEM[d.item].kind !== "egg") d.item = OLD_EGG[d.item] || "ember";
    if (!d.line || !DRAGONS[d.line]){
      d.line = ITEM[d.item].line;
      const sp = DRAGONS[d.line].name;
      if (!d.name || OLD_SPECIES.includes(d.name)) d.name = sp;
      d.species = sp;
    }
    if (d.mut && !MUTATIONS[d.mut]) d.mut = null;
    if (d.trail && !ITEM[d.trail]) d.trail = null;
    if (!d.reveals) d.reveals = {};
    delete d.color; delete d.horns; delete d.base;
  });
  S.eggs.forEach(e => { if (!ITEM[e.item]) e.item = OLD_EGG[e.item] || "ember"; });
  Object.keys(S.owned).forEach(k => { if (!ITEM[k]) delete S.owned[k]; });
  Object.keys(S.bought).forEach(k => { if (!ITEM[k]) delete S.bought[k]; });
}
function start(data){
  S = (data && data.state) ? Object.assign(fresh(), data.state) : (load() || fresh());
  if (!S.opened) S.opened = {};
  migrate();
  ITEMS.forEach(it => { if (S.owned[it.id]) for (let k = 1; k <= it.scene; k++) S.opened[k] = true; });
  applyDebugParams();
  shown = S.bank;
  $("#balance").textContent = fmt(S.bank);
  buildScenes();
  if (DEBUG) debugPanel();
  setTab(S.tab || "bank");
  setTimeout(autoHatch, 600);
}
try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({state: S})); } catch(e){}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start(window.claude && window.claude.hot && window.claude.hot.data || {});
})();
</script>
